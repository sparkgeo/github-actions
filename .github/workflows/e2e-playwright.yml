name: E2E

# Reusable end-to-end gate (issue #75): runs the repo's Playwright suite with
# the playwright composite, optionally sharded across runners, with browsers
# and dependencies cached, check annotations per failure, traces on failure
# and one merged HTML report.
#
# Deliberately does NOT use step-security/harden-runner: this workflow runs in
# the caller's context and may be consumed by private repos where third-party
# CI telemetry is not acceptable. See docs/approved-actions.md.

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Project directory holding package.json, the lockfile and playwright.config'
        default: '.'
        type: string
      target-url:
        description: 'URL under test; empty uses the webServer in playwright.config'
        default: ''
        type: string
      project:
        description: 'Playwright project name to run (empty runs all)'
        default: ''
        type: string
      shards:
        description: 'Number of parallel shards'
        default: 1
        type: number
      browsers:
        description: 'Space-separated browsers to install: chromium, firefox, webkit'
        default: 'chromium'
        type: string
      extra-args:
        description: 'Extra arguments passed to playwright test'
        default: ''
        type: string
      runtime-version:
        description: 'Node version; empty reads .nvmrc, then .node-version, then 22'
        default: ''
        type: string
      install-command:
        description: 'Override dependency install (runs after setup-node)'
        default: ''
        type: string
      actions-ref:
        description: >-
          Ref or commit SHA of sparkgeo/github-actions to load the playwright
          composite from. Pin this to the SAME SHA you pinned
          e2e-playwright.yml to, so the whole workflow is immutable.
        default: 'main'
        type: string

# No permissions block: a reusable workflow inherits the caller job's granted
# permissions. The caller grants `contents: read`. See README.
jobs:
  shards:
    name: Plan shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: echo "matrix=$(seq 1 "${SHARDS}" | jq -cs .)" >> "${GITHUB_OUTPUT}"

  test:
    name: Playwright ${{ matrix.shard }}/${{ inputs.shards }}
    needs: shards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.matrix) }}
    outputs:
      playwright-version: ${{ steps.pw.outputs.playwright-version }}
    steps:
      - name: Checkout repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Load the composite action at the caller-pinned ref into a fixed path,
      # then invoke it locally. Keeps the action reference immutable (no
      # mutable cross-repo @main) while honouring the repo's SHA-pin policy.
      - name: Checkout playwright composite action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sparkgeo/github-actions
          ref: ${{ inputs.actions-ref }}
          path: .sparkgeo-github-actions
          persist-credentials: false

      - id: pw
        uses: ./.sparkgeo-github-actions/.github/actions/playwright
        with:
          working-directory: ${{ inputs.working-directory }}
          target-url: ${{ inputs.target-url }}
          project: ${{ inputs.project }}
          browsers: ${{ inputs.browsers }}
          shard-index: ${{ inputs.shards > 1 && matrix.shard || '' }}
          shard-total: ${{ inputs.shards > 1 && inputs.shards || '' }}
          extra-args: ${{ inputs.extra-args }}
          node-version: ${{ inputs.runtime-version }}
          install-command: ${{ inputs.install-command }}
          artifact-name: playwright

  # One HTML report across shards. A single shard already carries its HTML
  # report in playwright-results.
  report:
    name: Merge report
    needs: test
    if: ${{ always() && inputs.shards > 1 && needs.test.outputs.playwright-version != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download shard blobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: playwright-results-*
          path: shards
          merge-multiple: false

      - name: Merge
        env:
          VERSION: ${{ needs.test.outputs.playwright-version }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ runner.temp }}/playwright-report
        run: |
          set -euo pipefail
          mkdir -p blobs
          find shards -path '*/blob/*.zip' -exec cp {} blobs/ \;
          npx --yes "@playwright/test@${VERSION}" merge-reports --reporter html blobs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: ${{ runner.temp }}/playwright-report/
          retention-days: 14
