name: Build Provenance

# Reusable release-stage workflow that produces SLSA Build Level 3 provenance
# for release files or a container image digest with GitHub artifact
# attestations, and optionally attaches an SBOM attestation to the same
# subject. Attestations are signed keylessly through Sigstore with this
# workflow's OIDC token and stored against the calling repository, so there
# are no keys to manage. Verify at deploy time with `gh attestation verify`
# (see README). Complements container-sign.yml (cosign, issue #15): cosign
# signs the image digest; provenance records how that digest was produced.
#
# Files must arrive as a workflow artefact (subject-artifact) because this
# workflow runs in its own job; image digests need no download.
#
# Deliberately does NOT use step-security/harden-runner: this workflow runs in
# the caller's context and may be consumed by private repos where third-party
# CI telemetry is not acceptable. See docs/approved-actions.md.

on:
  workflow_call:
    inputs:
      subject-artifact:
        description: 'Workflow artefact holding the files to attest; downloaded into subjects/. Leave empty when attesting an image digest.'
        default: ''
        type: string
      subject-path:
        description: 'Path glob of the files to attest (relative to the job workspace; the artefact lands in subjects/)'
        default: 'subjects/*'
        type: string
      subject-digest:
        description: 'Container image digest to attest instead of files (sha256:...)'
        default: ''
        type: string
      subject-name:
        description: 'Fully qualified image name when attesting a digest (e.g. ghcr.io/sparkgeo/my-image)'
        default: ''
        type: string
      sbom-artifact:
        description: 'Workflow artefact holding the SBOM (from sbom-generate.yml); downloaded into sbom/. Leave empty to skip the SBOM attestation.'
        default: ''
        type: string
      sbom-path:
        description: 'SBOM file to attach as an SBOM attestation (CycloneDX or SPDX JSON)'
        default: 'sbom/sbom.cyclonedx.json'
        type: string
    outputs:
      provenance-attestation-id:
        description: 'ID of the build provenance attestation'
        value: ${{ jobs.attest.outputs.provenance-attestation-id }}
      sbom-attestation-id:
        description: 'ID of the SBOM attestation (empty when skipped)'
        value: ${{ jobs.attest.outputs.sbom-attestation-id }}

# No permissions block: a reusable workflow inherits the caller job's granted
# permissions. The caller grants `id-token: write` (Sigstore signing),
# `attestations: write` (store the attestation), `contents: read`, and
# `packages: write` when an image subject is pushed to GHCR.
jobs:
  attest:
    name: Attest
    runs-on: ubuntu-latest
    outputs:
      provenance-attestation-id: ${{ steps.provenance.outputs.attestation-id }}
      sbom-attestation-id: ${{ steps.sbom.outputs.attestation-id }}
    steps:
      - name: Download subject artefact
        if: inputs.subject-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.subject-artifact }}
          path: subjects

      - name: Download SBOM artefact
        if: inputs.sbom-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.sbom-artifact }}
          path: sbom

      # Exactly one of subject-path / subject-digest may be set on the attest
      # actions, so the file inputs are blanked when a digest is given.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ inputs.subject-digest == '' && inputs.subject-path || '' }}
          subject-digest: ${{ inputs.subject-digest }}
          subject-name: ${{ inputs.subject-name }}
          push-to-registry: ${{ inputs.subject-digest != '' }}

      - name: Attest SBOM
        id: sbom
        if: inputs.sbom-path != '' && (inputs.sbom-artifact != '' || inputs.subject-digest != '')
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: ${{ inputs.subject-digest == '' && inputs.subject-path || '' }}
          subject-digest: ${{ inputs.subject-digest }}
          subject-name: ${{ inputs.subject-name }}
          sbom-path: ${{ inputs.sbom-path }}
          push-to-registry: ${{ inputs.subject-digest != '' }}
