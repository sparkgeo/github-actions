name: Lint App

# Reusable PR lint gate for application source code. Runs MegaLinter, which
# auto-detects every language in the repo and runs the appropriate linter and
# formatter check for each. Findings upload to the Security tab as SARIF; the
# job fails on any linter error.
#
# Configured entirely via a .mega-linter.yml in the consuming repo (optional).
#
# Image size dominates run time (full image ~4.8 GB compressed, ~3 min to
# pull; flavors 1.5-2.7 GB). Pick the smallest `flavor` that covers your
# languages: https://megalinter.io/latest/flavors/. `uses:` cannot take an
# expression, so one SHA-pinned step per supported flavor is declared and
# selected with `if:`.
#
# No composite wrapper: MegaLinter must run as a job step so the SARIF upload
# can use continue-on-error + if:always (composite steps support neither),
# guaranteeing findings reach the Security tab even when the lint gate fails.
#
# Deliberately does NOT use step-security/harden-runner: this workflow runs in
# the caller's context and may be consumed by private repos where third-party
# CI telemetry is not acceptable. See docs/approved-actions.md.

on:
  workflow_call:
    inputs:
      default-branch:
        description: 'Default branch MegaLinter diffs against'
        default: 'main'
        type: string
      filter-regex-exclude:
        description: "Regex of paths to exclude (e.g. 'dist/|generated/')"
        default: ''
        type: string
      sarif-upload:
        description: 'Upload SARIF results to the GitHub Security tab'
        default: true
        type: boolean
      flavor:
        description: >-
          MegaLinter flavor image: full (default, all linters), cupcake,
          documentation, ci_light, python, javascript, terraform, go.
          Smaller flavors pull much faster; see https://megalinter.io/latest/flavors/
        default: 'full'
        type: string
      validate-all-codebase:
        description: >-
          Lint every file (true) or only files changed against default-branch
          (false). Default 'auto': false on pull_request, true otherwise.
        default: 'auto'
        type: string

# No permissions block: a reusable workflow inherits the caller job's granted
# permissions. The caller grants `contents: read` (always) and adds
# `security-events: write` only when it wants SARIF upload. See README.

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # MegaLinter needs history to diff against the base

      - name: Resolve MegaLinter settings
        env:
          FLAVOR: ${{ inputs.flavor }}
          VALIDATE_ALL: ${{ inputs.validate-all-codebase }}
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          FILTER_REGEX_EXCLUDE: ${{ inputs.filter-regex-exclude }}
        run: |
          set -euo pipefail
          case "${FLAVOR}" in
            full|cupcake|documentation|ci_light|python|javascript|terraform|go) ;;
            *) echo "::error::unsupported flavor '${FLAVOR}' (full|cupcake|documentation|ci_light|python|javascript|terraform|go)"; exit 1 ;;
          esac
          case "${VALIDATE_ALL}" in
            auto) [ "${EVENT}" = "pull_request" ] && VALIDATE_ALL=false || VALIDATE_ALL=true ;;
            true|false) ;;
            *) echo "::error::validate-all-codebase must be auto, true or false"; exit 1 ;;
          esac
          # Docker actions inherit the job environment, so settings shared by
          # every flavor step are exported once here.
          {
            echo "DEFAULT_BRANCH=${DEFAULT_BRANCH}"
            echo "FILTER_REGEX_EXCLUDE=${FILTER_REGEX_EXCLUDE}"
            echo "VALIDATE_ALL_CODEBASE=${VALIDATE_ALL}"
            echo "APPLY_FIXES=none"
            echo "SARIF_REPORTER=true"
            echo "GITHUB_COMMENT_REPORTER=false"
            echo "GITHUB_STATUS_REPORTER=false"
          } >> "${GITHUB_ENV}"
          echo "flavor=${FLAVOR} validate-all-codebase=${VALIDATE_ALL}"

      # One step per flavor, same upstream commit. Exactly one runs.
      - name: MegaLinter (full)
        id: ml_full
        if: ${{ inputs.flavor == 'full' }}
        uses: oxsecurity/megalinter@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc  # v9.6.0
        continue-on-error: true  # let the SARIF upload run before we gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter (cupcake)
        id: ml_cupcake
        if: ${{ inputs.flavor == 'cupcake' }}
        uses: oxsecurity/megalinter/flavors/cupcake@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc  # v9.6.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter (documentation)
        id: ml_documentation
        if: ${{ inputs.flavor == 'documentation' }}
        uses: oxsecurity/megalinter/flavors/documentation@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc  # v9.6.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter (ci_light)
        id: ml_ci_light
        if: ${{ inputs.flavor == 'ci_light' }}
        uses: oxsecurity/megalinter/flavors/ci_light@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc  # v9.6.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter (python)
        id: ml_python
        if: ${{ inputs.flavor == 'python' }}
        uses: oxsecurity/megalinter/flavors/python@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc  # v9.6.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter (javascript)
        id: ml_javascript
        if: ${{ inputs.flavor == 'javascript' }}
        uses: oxsecurity/megalinter/flavors/javascript@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc  # v9.6.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter (terraform)
        id: ml_terraform
        if: ${{ inputs.flavor == 'terraform' }}
        uses: oxsecurity/megalinter/flavors/terraform@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc  # v9.6.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: MegaLinter (go)
        id: ml_go
        if: ${{ inputs.flavor == 'go' }}
        uses: oxsecurity/megalinter/flavors/go@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc  # v9.6.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Decide whether to upload: codeql-action rejects a SARIF whose `runs`
      # array is empty ("1 item required; only 0 were supplied"). MegaLinter
      # emits an empty SARIF when nothing reportable is found.
      - name: Check SARIF has content
        id: sarif
        if: ${{ always() && inputs.sarif-upload }}
        env:
          SARIF_FILE: megalinter-reports/megalinter-report.sarif
        run: |
          set -euo pipefail
          if [ -f "${SARIF_FILE}" ] && [ "$(jq '.runs | length' "${SARIF_FILE}")" -gt 0 ]; then
            echo "upload=true" >> "${GITHUB_OUTPUT}"
          else
            echo "upload=false" >> "${GITHUB_OUTPUT}"
            echo "No SARIF runs to upload — skipping."
          fi

      - name: Upload SARIF to GitHub Security tab
        if: ${{ always() && steps.sarif.outputs.upload == 'true' }}
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
        with:
          sarif_file: megalinter-reports/megalinter-report.sarif
          category: megalinter

      - name: Enforce gate
        if: ${{ always() }}
        env:
          # Skipped flavor steps report 'skipped'; the one that ran reports
          # success or failure. Any failure in the job fails the gate.
          FAILED: ${{ contains(steps.*.outcome, 'failure') }}
        run: |
          set -euo pipefail
          if [ "${FAILED}" = "true" ]; then
            echo "::error::MegaLinter reported lint errors — see the annotations and the Security tab."
            exit 1
          fi
          echo "MegaLinter passed."
