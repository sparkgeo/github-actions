name: Asset Register Roll-up

# Daily org-wide asset register (issue #116, plan Step 31 Standard). Reads the
# asset-inventory-latest release of every sparkgeo repository with a
# read-only GitHub App token, verifies each inventory against its SHA256SUMS,
# merges them with the asset-register composite and publishes the register to
# the rolling asset-register-latest release plus a dated tag (90 retained).
# Opens or updates a tracking issue while any asset is unowned or any
# inventory is stale, and closes it once a run is clean.
#
# The App needs only contents: read and metadata: read on the org's repos;
# nothing here can write to a consuming repository. Without the App secrets
# the run falls back to GITHUB_TOKEN, which sees public repositories only.
# Runs only in this repo on a schedule: no user-controlled input reaches a
# run: block.

on:
  schedule:
    - cron: '41 6 * * *'  # daily, 06:41 UTC, after consuming repos' overnight runs
  workflow_dispatch:

permissions: {}

concurrency:
  group: asset-register-rollup
  cancel-in-progress: false

jobs:
  rollup:
    name: Roll up
    runs-on: ubuntu-latest
    permissions:
      contents: write  # releases and tags in this repo
      issues: write    # tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Pick the read token
        id: pick
        env:
          APP_ID: ${{ secrets.ASSET_REGISTER_APP_ID }}
          APP_KEY: ${{ secrets.ASSET_REGISTER_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${APP_ID}" ] && [ -n "${APP_KEY}" ]; then
            echo "app=true" >> "${GITHUB_OUTPUT}"
          else
            echo "app=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=asset-register::ASSET_REGISTER_APP_ID or ASSET_REGISTER_APP_PRIVATE_KEY not set; only public repositories are read"
          fi

      - name: Mint a read-only App token
        id: app
        if: steps.pick.outputs.app == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.ASSET_REGISTER_APP_ID }}
          private-key: ${{ secrets.ASSET_REGISTER_APP_PRIVATE_KEY }}
          # The register must read every repository in the org; the token is
          # read-only and limited to the two permissions below.
          owner: ${{ github.repository_owner }}  # zizmor: ignore[github-app]
          permission-contents: read
          permission-metadata: read

      - name: Collect inventories
        id: collect
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          ORG: ${{ github.repository_owner }}
          DIR: ${{ runner.temp }}/inventories
        run: |
          set -euo pipefail
          mkdir -p "${DIR}"
          found=0
          while IFS= read -r repo; do
            [ -n "${repo}" ] || continue
            name="${repo#*/}"
            if ! gh release view asset-inventory-latest -R "${repo}" --json id > /dev/null 2>&1; then
              continue
            fi
            mkdir -p "${DIR}/${name}"
            if ! gh release download asset-inventory-latest -R "${repo}" -D "${DIR}/${name}" --clobber -p inventory.json -p SHA256SUMS; then
              echo "::warning title=asset-register::${repo}: download failed, skipped"
              rm -rf "${DIR:?}/${name}"
              continue
            fi
            if ! ( cd "${DIR}/${name}" && sha256sum -c --ignore-missing --quiet SHA256SUMS ); then
              echo "::warning title=asset-register::${repo}: SHA256SUMS mismatch, skipped"
              rm -rf "${DIR:?}/${name}"
              continue
            fi
            found=$((found + 1))
            echo "${repo}: collected"
          done < <(gh repo list "${ORG}" --limit 1000 --no-archived --json nameWithOwner --jq '.[].nameWithOwner' | sort)
          echo "found=${found}" >> "${GITHUB_OUTPUT}"
          echo "${found} inventories collected"

      - id: register
        uses: ./.github/actions/asset-register
        with:
          inventories-dir: ${{ runner.temp }}/inventories
          output-dir: ${{ runner.temp }}/register

      - name: Publish dated and latest releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          DIR: ${{ runner.temp }}/register
          SUMMARY: ${{ steps.register.outputs.summary-path }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%F)"
          {
            echo "Org-wide asset register ${DATE} (UTC), built by \`.github/actions/asset-register\` at ${TARGET}."
            echo
            cat "${SUMMARY}"
            echo
            echo "Verify with \`sha256sum -c SHA256SUMS\`. Format: docs/asset-inventory.md."
          } > "${RUNNER_TEMP}/release-notes.md"
          publish() {  # <tag> <title>; recreate so a rerun on the same day, or the rolling tag, is replaced
            gh release delete "${1}" -R "${REPO}" --cleanup-tag --yes 2>/dev/null || true
            gh release create "${1}" -R "${REPO}" --target "${TARGET}" --title "${2}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" --latest=false "${DIR}"/*
          }
          publish "asset-register-${DATE}" "Asset register ${DATE}"
          publish "asset-register-latest" "Asset register (latest: ${DATE})"

      - name: Prune dated releases beyond 90
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release list -R "${REPO}" --limit 500 --json tagName \
            --jq '.[].tagName | select(test("^asset-register-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' \
            | sort -r | tail -n +91 \
            | while IFS= read -r tag; do
                echo "pruning ${tag}"
                gh release delete "${tag}" -R "${REPO}" --cleanup-tag --yes
              done

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UNOWNED: ${{ steps.register.outputs.unowned-count }}
          STALE: ${{ steps.register.outputs.stale-count }}
          SUMMARY: ${{ steps.register.outputs.summary-path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Asset register: unowned or stale assets"
          existing="$(gh issue list -R "${REPO}" --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          if [ "${UNOWNED}" = "0" ] && [ "${STALE}" = "0" ]; then
            if [ -n "${existing}" ]; then
              gh issue close "${existing}" -R "${REPO}" --comment "Clean run on $(date -u +%F): every asset has an owner and every inventory is fresh. ${RUN_URL}"
            fi
            exit 0
          fi
          {
            echo "Run of $(date -u +%F): ${RUN_URL}. Full register: release \`asset-register-latest\` (\`unowned.md\`, \`owners.md\`, \`data-classes.md\`)."
            echo
            cat "${SUMMARY}"
          } > "${RUNNER_TEMP}/issue-body.md"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" -R "${REPO}" --body-file "${RUNNER_TEMP}/issue-body.md"
          else
            gh issue create -R "${REPO}" --title "${TITLE}" --label security --body-file "${RUNNER_TEMP}/issue-body.md"
          fi
