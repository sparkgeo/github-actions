name: DAST Scheduled

# Reusable weekly active DAST of a staging environment (SecOps plan Step 5
# Advanced; issue #68): ZAP full scan (spider plus active rules), ZAP API scan
# when spec-url is set, and nuclei, so new ZAP rules and nuclei templates and
# drift in a deployed service are caught without a new commit. A guard job
# refuses any target whose host matches production-pattern before a single
# request is sent. High and Critical findings open or update one tracking
# issue per target; every report is kept as an artefact for 90 days as audit
# evidence. Consuming repos call it from `on: schedule` (e.g. '0 3 * * 1').
#
# Deliberately does NOT use step-security/harden-runner: this workflow runs in
# the caller's context and may be consumed by private repos where third-party
# CI telemetry is not acceptable. The hosts it reaches: ghcr.io (ZAP image),
# github.com (nuclei and templates), target-url and spec-url.

on:
  workflow_call:
    inputs:
      target-url:
        description: 'Staging URL to scan (never production)'
        required: true
        type: string
      spec-url:
        description: 'Optional OpenAPI definition (URL or repo path); adds a ZAP API scan'
        default: ''
        type: string
      fail-on:
        description: 'Lowest severity that fails the run: critical|high|medium|low|none'
        default: 'high'
        type: string
      production-pattern:
        description: 'Regular expression; a target host that matches it is refused'
        default: '(^|[.-])(prod|production|live)([.-]|$)|^www\.'
        type: string
      rules-file:
        description: 'Optional ZAP rules TSV in the consuming repo'
        default: ''
        type: string
      nuclei-templates:
        description: 'nuclei template directories (see dast-nuclei.yml)'
        default: 'cves,misconfiguration,exposures'
        type: string
      open-issues:
        description: 'Open or update a tracking issue on High and Critical findings'
        default: true
        type: boolean
      actions-ref:
        description: >-
          Ref or commit SHA of sparkgeo/github-actions to load the composites
          from. Pin this to the SAME SHA you pinned dast-scheduled.yml to, so
          the whole workflow is immutable.
        default: 'main'
        type: string
    secrets:
      AUTH_HEADER:
        description: 'Optional "Header-Name: value" for the ZAP API scan and nuclei'
        required: false

# No permissions block: a reusable workflow inherits the caller job's granted
# permissions. The caller grants `contents: read`, `issues: write` (drop it
# with open-issues: false) and `security-events: write` (nuclei SARIF).
jobs:
  guard:
    name: Production guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sparkgeo/github-actions
          ref: ${{ inputs.actions-ref }}
          path: .sparkgeo-github-actions
          persist-credentials: false

      - name: Refuse production targets
        env:
          TARGET: ${{ inputs.target-url }}
          PATTERN: ${{ inputs.production-pattern }}
        run: python3 -I .sparkgeo-github-actions/.github/actions/dast-report/guard.py --target "${TARGET}" --pattern "${PATTERN}"

  zap-full:
    name: ZAP full scan
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository under test (rules file)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sparkgeo/github-actions
          ref: ${{ inputs.actions-ref }}
          path: .sparkgeo-github-actions
          persist-credentials: false

      - uses: ./.sparkgeo-github-actions/.github/actions/zap-baseline
        with:
          target-url: ${{ inputs.target-url }}
          scan: full
          spider-minutes: 5
          rules-file: ${{ inputs.rules-file }}
          fail-on: none
          report-dir: ${{ runner.temp }}/zap-full

      - name: Keep the report (90 days)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dast-zap-full
          path: ${{ runner.temp }}/zap-full/
          retention-days: 90
          if-no-files-found: ignore

  zap-api:
    name: ZAP API scan
    needs: guard
    if: inputs.spec-url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository under test (definition and rules file)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sparkgeo/github-actions
          ref: ${{ inputs.actions-ref }}
          path: .sparkgeo-github-actions
          persist-credentials: false

      - uses: ./.sparkgeo-github-actions/.github/actions/zap-api
        with:
          target-url: ${{ inputs.target-url }}
          spec-url: ${{ inputs.spec-url }}
          rules-file: ${{ inputs.rules-file }}
          auth-header: ${{ secrets.AUTH_HEADER }}
          fail-on: none
          report-dir: ${{ runner.temp }}/zap-api

      - name: Keep the report (90 days)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dast-zap-api
          path: ${{ runner.temp }}/zap-api/
          retention-days: 90
          if-no-files-found: ignore

  nuclei:
    name: Nuclei
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sparkgeo/github-actions
          ref: ${{ inputs.actions-ref }}
          path: .sparkgeo-github-actions
          persist-credentials: false

      - uses: ./.sparkgeo-github-actions/.github/actions/nuclei
        with:
          target-url: ${{ inputs.target-url }}
          templates: ${{ inputs.nuclei-templates }}
          headers: ${{ secrets.AUTH_HEADER }}
          fail-on-severity: none

      - name: Keep the results (90 days)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dast-nuclei
          path: ${{ runner.temp }}/nuclei-out/
          retention-days: 90
          if-no-files-found: ignore

  report:
    name: Report and track
    needs: [guard, zap-full, zap-api, nuclei]
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sparkgeo/github-actions
          ref: ${{ inputs.actions-ref }}
          path: .sparkgeo-github-actions
          persist-credentials: false

      - name: Download the scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: dast-*
          path: ${{ runner.temp }}/dast

      - id: report
        uses: ./.sparkgeo-github-actions/.github/actions/dast-report
        with:
          target-url: ${{ inputs.target-url }}
          zap-reports: |
            ${{ runner.temp }}/dast/dast-zap-full/zap.json
            ${{ runner.temp }}/dast/dast-zap-api/zap.json
          nuclei-results: ${{ runner.temp }}/dast/dast-nuclei/nuclei.json
          fail-on: ${{ inputs.fail-on }}
          open-issues: ${{ inputs.open-issues }}

      - name: Keep the combined findings (90 days)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dast-findings
          path: ${{ steps.report.outputs.findings }}
          retention-days: 90
          if-no-files-found: ignore
