name: Asset Inventory

# Reusable workflow that turns a repo's OpenTofu plan JSONs or CDK synth
# output into an asset register (issue #115, plan Step 31): inventory.json,
# a Graphviz diagram and a Mermaid block grouped by project, environment and
# owner. On pull requests it diffs against the last published inventory and
# keeps one PR comment; on pushes to the default branch it publishes the
# register as a rolling `asset-inventory-latest` release in the calling repo.
# The caller produces the plan or synth artefact (cost-diff-tofu.yml,
# dr-check-*.yml or its own plan step).
#
# Deliberately does NOT use step-security/harden-runner: this workflow runs in
# the caller's context and may be consumed by private repos where third-party
# CI telemetry is not acceptable. See docs/approved-actions.md.

on:
  workflow_call:
    inputs:
      stack:
        description: 'tofu or cdk'
        required: true
        type: string
      plan-artifact:
        description: 'Artefact name holding the plan JSONs or the cdk.out folder'
        required: true
        type: string
      publish:
        description: 'On push to the default branch, publish inventory.json, inventory.svg, inventory.mmd and SHA256SUMS to the asset-inventory-latest release'
        default: true
        type: boolean
      mermaid-max-nodes:
        description: 'Embed the Mermaid diagram in the comment only up to this many resources'
        default: 60
        type: number
      required-tags:
        description: 'Comma-separated required tag keys'
        default: 'owner,project,environment,data-class,exposure'
        type: string
      account:
        description: 'Cloud account id to record on every resource'
        default: ''
        type: string
      comment:
        description: 'Keep one PR comment up to date with the report (needs pull-requests: write)'
        default: true
        type: boolean
      actions-ref:
        description: >-
          Ref or commit SHA of sparkgeo/github-actions to load the composite
          from. Pin this to the SAME SHA you pinned asset-inventory.yml to, so
          the whole workflow is immutable.
        default: 'main'
        type: string
    outputs:
      resource-count:
        description: 'Resources in the inventory'
        value: ${{ jobs.inventory.outputs.resource-count }}
      violation-count:
        description: 'Resources missing a required tag'
        value: ${{ jobs.inventory.outputs.violation-count }}

# No permissions block: a reusable workflow inherits the caller job's granted
# permissions. The caller grants `contents: read`, `pull-requests: write` for
# the PR comment, and `contents: write` on default-branch runs that publish
# the release. See README.
jobs:
  inventory:
    name: Asset Inventory
    runs-on: ubuntu-latest
    outputs:
      resource-count: ${{ steps.inv.outputs.resource-count }}
      violation-count: ${{ steps.inv.outputs.violation-count }}
    steps:
      # Load the composite action at the caller-pinned ref into a fixed path,
      # then invoke it locally. Keeps the action reference immutable (no
      # mutable cross-repo @main) while honouring the repo's SHA-pin policy.
      - name: Checkout sparkgeo composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sparkgeo/github-actions
          ref: ${{ inputs.actions-ref }}
          path: .sparkgeo-github-actions
          persist-credentials: false

      - name: Download plan artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.plan-artifact }}
          path: plans

      # The last published register, for the PR diff. Absent until the first
      # default-branch run has published one.
      - name: Fetch published inventory
        id: base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release download asset-inventory-latest -R "${REPO}" -p inventory.json -D "${RUNNER_TEMP}/base" 2>/dev/null; then
            echo "path=${RUNNER_TEMP}/base/inventory.json" >> "${GITHUB_OUTPUT}"
          else
            echo "path=" >> "${GITHUB_OUTPUT}"
            echo "::notice title=asset-inventory::no asset-inventory-latest release yet; nothing to diff against"
          fi

      - name: Build inventory
        id: inv
        uses: ./.sparkgeo-github-actions/.github/actions/asset-inventory
        with:
          stack: ${{ inputs.stack }}
          input-dir: plans
          required-tags: ${{ inputs.required-tags }}
          account: ${{ inputs.account }}
          base-inventory: ${{ steps.base.outputs.path || '' }}
          mermaid-max-nodes: ${{ inputs.mermaid-max-nodes }}
          output-dir: ${{ runner.temp }}/asset-inventory

      - name: Upload inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: asset-inventory
          path: ${{ runner.temp }}/asset-inventory/

      # One comment per PR, found by its marker and edited in place. Fork PRs
      # get a read-only token and are skipped.
      - name: Update PR comment
        if: >-
          inputs.comment && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ steps.inv.outputs.report-path }}
        run: |
          set -euo pipefail
          existing="$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- asset-inventory -->")) | .id] | first // empty')"
          body="$(jq -n --rawfile r "${REPORT}" '{body: $r}')"
          if [ -n "${existing}" ]; then
            echo "${body}" | gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" --input - > /dev/null
          else
            echo "${body}" | gh api -X POST "repos/${REPO}/issues/${PR}/comments" --input - > /dev/null
          fi

      # Rolling release in the calling repo; the org roll-up reads it.
      - name: Publish to the asset-inventory-latest release
        if: >-
          inputs.publish && github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DIR: ${{ runner.temp }}/asset-inventory
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          files=("${DIR}/inventory.json" "${DIR}/inventory.svg" "${DIR}/inventory.mmd" "${DIR}/SHA256SUMS")
          if gh release view asset-inventory-latest -R "${REPO}" --json id > /dev/null 2>&1; then
            gh release upload asset-inventory-latest -R "${REPO}" --clobber "${files[@]}"
            gh release edit asset-inventory-latest -R "${REPO}" --notes "Asset inventory from ${SHA}. See docs/asset-inventory.md in sparkgeo/github-actions."
          else
            gh release create asset-inventory-latest -R "${REPO}" --target "${SHA}" --title "Asset inventory (latest)" \
              --notes "Asset inventory from ${SHA}. See docs/asset-inventory.md in sparkgeo/github-actions." "${files[@]}"
          fi
