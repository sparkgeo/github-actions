name: Verify (Map)

# Reusable PR check (issue #132, plan Step 39): validates the repository's
# verify.yml, says which changed files sit on mapped or high-risk paths and
# which rungs must report on them, flags high-risk paths with no rung and
# implementation changes without a model change, and at Standard tier
# requires the PR body's "## Verification" table (each acceptance criterion
# cites the contract, property, model or proof that covers it). The other
# verify-*.yml workflows read the same map.
#
# Deliberately does NOT use step-security/harden-runner: this workflow runs in
# the caller's context and may be consumed by private repos where third-party
# CI telemetry is not acceptable. Egress: github.com and PyPI.

on:
  workflow_call:
    inputs:
      map-path:
        description: 'verify.yml in the repository'
        default: 'verify.yml'
        type: string
      high-risk-globs:
        description: 'Fallback globs when verify.yml is absent; empty uses the HIGH_RISK_GLOBS list from verify-brief.yml'
        default: ''
        type: string
      require-table:
        description: 'Fail when mapped paths changed and the PR body has no verification table (Standard tier)'
        default: false
        type: boolean
      strict-high-risk:
        description: 'Fail on a changed high-risk path with no rung'
        default: false
        type: boolean
      actions-ref:
        description: >-
          Ref or commit SHA of sparkgeo/github-actions to load the composite
          and the schema from. Pin this to the SAME SHA you pinned
          verify-map.yml to, so the whole workflow is immutable.
        default: 'main'
        type: string
    outputs:
      mapped-count:
        description: 'Changed files on mapped paths'
        value: ${{ jobs.map.outputs.mapped-count }}
      bare-high-risk-count:
        description: 'Changed high-risk files with no rung'
        value: ${{ jobs.map.outputs.bare-high-risk-count }}

# No permissions block: a reusable workflow inherits the caller job's granted
# permissions. The caller grants contents: read.
jobs:
  map:
    name: Verification map
    runs-on: ubuntu-latest
    outputs:
      mapped-count: ${{ steps.map.outputs.mapped-count }}
      bare-high-risk-count: ${{ steps.map.outputs.bare-high-risk-count }}
    steps:
      - name: Checkout repository under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the base must be reachable for the changed-files diff

      # Load the composite action at the caller-pinned ref into a fixed path,
      # then invoke it locally. Keeps the action reference immutable (no mutable
      # cross-repo @main) while honouring the repo's SHA-pin policy.
      - name: Checkout verify-map composite action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: sparkgeo/github-actions
          ref: ${{ inputs.actions-ref }}
          path: .sparkgeo-github-actions
          persist-credentials: false

      - id: map
        uses: ./.sparkgeo-github-actions/.github/actions/verify-map
        with:
          map-path: ${{ inputs.map-path }}
          high-risk-globs: ${{ inputs.high-risk-globs }}
          require-table: ${{ inputs.require-table }}
          strict-high-risk: ${{ inputs.strict-high-risk }}
          output-path: ${{ runner.temp }}/verify-map.json

      - name: Upload map
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: verify-map
          path: ${{ runner.temp }}/verify-map.json
          retention-days: 30
