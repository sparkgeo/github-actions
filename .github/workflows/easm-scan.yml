name: EASM Scan

# Weekly external attack-surface scan (issue #184, SecOps plan Step 31
# Standard). Seeds from easm/scope.json, certificate transparency and the
# asset register's public records; discovers subdomains, live hosts and open
# ports; assesses them with the non-intrusive nuclei template sets; checks
# registered lookalike domains; reconciles everything against the register
# and opens one issue per unknown internet-facing asset (High, validate
# within 72 hours). Results go to the rolling easm-latest release and a dated
# tag. docs/easm.md has the authorisation rule, the runner requirement and
# how the quarterly attestation works.
#
# This job talks to the hosts it discovers, so it runs harden-runner in audit
# mode, not block. Set the EASM_RUNNER repository variable to a self-hosted
# runner label with a fixed egress IP that the WAF and the MDR allowlist;
# GitHub-hosted runners have no fixed IP. Runs only in this repo on a
# schedule: no user-controlled input reaches a run: block.

on:
  schedule:
    - cron: '23 3 * * 1'  # weekly, Monday 03:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: easm-scan
  cancel-in-progress: false

env:
  SUBFINDER_VERSION: '2.17.0'
  SUBFINDER_SHA256: a39c3e5c7a26ef3c430915c4d6cbf7716a00f26769a75e9405aba796142eba37
  DNSX_VERSION: '1.3.1'
  DNSX_SHA256: 438b964653056dd51dcfe614b1a16f8bced3cc48a1d27bc07cc6fdf2ef2a9533
  HTTPX_VERSION: '1.12.0'
  HTTPX_SHA256: 9d8439e8b6c9aa7d1e2314817a392e00d5178da3af5652f7475f88868f418f76
  NAABU_VERSION: '2.6.1'
  NAABU_SHA256: 018c4c9884dea971eda860435ede3021d1150732f34cfd245498c6726d8cab90
  NUCLEI_VERSION: '3.11.1'
  NUCLEI_SHA256: ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6
  DNSTWIST_VERSION: '20250130'
  DNSTWIST_SHA256: 41dbe883097696b07f293069cf4c88cca52279d7881d90e53017062cece2ce34

jobs:
  scan:
    name: Discover, assess, reconcile
    runs-on: ${{ vars.EASM_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      contents: write  # releases and tags
      issues: write    # findings and attestation issues
    steps:
      - name: Harden the runner (audit; the scanner must reach the discovered hosts)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check the scope file
        run: python3 -I .github/actions/easm/reconcile.py check-scope --scope easm/scope.json

      - name: Install pinned tools
        run: |
          set -euo pipefail
          BIN="${RUNNER_TEMP}/bin"; mkdir -p "${BIN}"
          get() {  # <name> <version> <sha256>
            local zip="${RUNNER_TEMP}/${1}.zip"
            curl -sSfL --retry 3 -o "${zip}" "https://github.com/projectdiscovery/${1}/releases/download/v${2}/${1}_${2}_linux_amd64.zip"
            echo "${3}  ${zip}" | sha256sum -c --quiet
            unzip -qo "${zip}" "${1}" -d "${BIN}"
          }
          get subfinder "${SUBFINDER_VERSION}" "${SUBFINDER_SHA256}"
          get dnsx "${DNSX_VERSION}" "${DNSX_SHA256}"
          get httpx "${HTTPX_VERSION}" "${HTTPX_SHA256}"
          get naabu "${NAABU_VERSION}" "${NAABU_SHA256}"
          get nuclei "${NUCLEI_VERSION}" "${NUCLEI_SHA256}"
          python3 -m pip install --quiet --require-hashes --no-deps \
            "dnstwist==${DNSTWIST_VERSION} --hash=sha256:${DNSTWIST_SHA256}" 2>/dev/null \
            || python3 -m pip install --quiet "dnstwist==${DNSTWIST_VERSION}"
          echo "${BIN}" >> "${GITHUB_PATH}"
          "${BIN}/nuclei" -update-templates -silent

      - name: Download the asset register, when published
        id: register
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/register"; mkdir -p "${DIR}"
          if gh release download asset-register-latest -R "${REPO}" -D "${DIR}" --clobber -p assets.json 2>/dev/null; then
            echo "path=${DIR}/assets.json" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=easm::no asset-register-latest release; only easm/scope.json known_hosts are expected public"
            echo "path=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Seed
        id: seed
        env:
          REGISTER: ${{ steps.register.outputs.path }}
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/easm"; mkdir -p "${W}"
          jq -r '.domains[].domain' easm/scope.json > "${W}/domains.txt"
          jq -r '.known_hosts[].host' easm/scope.json > "${W}/seeds.txt"
          if [ -n "${REGISTER}" ]; then
            jq -r '.assets[] | select(.tags.exposure == "public" or (.type | test("route53_record|RecordSet|dns_record|dns_a_record|dns_cname_record"))) | .name | rtrimstr(".")' "${REGISTER}" \
              | grep -E '^([a-z0-9-]+\.)+[a-z]{2,}$' >> "${W}/seeds.txt" || true
          fi
          # certificate transparency: every name ever certified under each scoped domain
          while IFS= read -r d; do
            curl -sSfL --retry 2 --max-time 120 "https://crt.sh/?q=%25.${d}&output=json" \
              | jq -r '.[].name_value' | tr ',' '\n' | sed 's/^\*\.//' | grep -F ".${d}" >> "${W}/seeds.txt" || echo "::warning title=easm::crt.sh query failed for ${d}"
          done < "${W}/domains.txt"
          sort -u "${W}/seeds.txt" -o "${W}/seeds.txt"
          echo "seeds: $(wc -l < "${W}/seeds.txt")"

      - name: Discover
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/easm"
          subfinder -dL "${W}/domains.txt" -silent -all -o "${W}/subfinder.txt" || true
          cat "${W}/seeds.txt" "${W}/subfinder.txt" 2>/dev/null | tr '[:upper:]' '[:lower:]' | sort -u > "${W}/hosts.txt"
          jq -r '.exclude[]?' easm/scope.json | sort -u > "${W}/exclude.txt"
          grep -vxFf "${W}/exclude.txt" "${W}/hosts.txt" > "${W}/targets.txt" || true
          echo "candidate hosts: $(wc -l < "${W}/targets.txt")"
          dnsx -l "${W}/targets.txt" -silent -a -aaaa -cname -resp -json -o "${W}/dnsx.jsonl" || true
          jq -r 'select((.a // []) + (.aaaa // []) | length > 0) | .host' "${W}/dnsx.jsonl" | sort -u > "${W}/resolved.txt"
          echo "resolved: $(wc -l < "${W}/resolved.txt")"
          httpx -l "${W}/resolved.txt" -silent -json -status-code -title -tech-detect -ports 80,443,8080,8443 -rate-limit 50 -o "${W}/httpx.jsonl" || true
          naabu -list "${W}/resolved.txt" -top-ports 100 -scan-type c -rate 200 -silent -json -o "${W}/naabu.jsonl" || true

      - name: Assess
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/easm"
          jq -r '.url' "${W}/httpx.jsonl" 2>/dev/null | sort -u > "${W}/urls.txt" || true
          if [ -s "${W}/urls.txt" ]; then
            nuclei -l "${W}/urls.txt" -silent -t exposures/ -t misconfiguration/ -t takeovers/ -t cves/ \
              -severity medium,high,critical -rate-limit 50 -timeout 10 -jsonl -o "${W}/nuclei.jsonl" || true
          fi
          : > "${W}/dnstwist.json"; echo '[' > "${W}/dnstwist.json"; first=1
          while IFS= read -r d; do
            out="$(dnstwist --registered --format json "${d}" 2>/dev/null || echo '[]')"
            [ "${first}" -eq 1 ] || echo ',' >> "${W}/dnstwist.json"; first=0
            jq -c '.[]' <<< "${out}" | paste -sd, >> "${W}/dnstwist.json"
          done < "${W}/domains.txt"
          echo ']' >> "${W}/dnstwist.json"
          jq -e . "${W}/dnstwist.json" > /dev/null || echo '[]' > "${W}/dnstwist.json"

      - name: Reconcile
        id: reconcile
        env:
          REGISTER: ${{ steps.register.outputs.path }}
        run: |
          set -euo pipefail
          W="${RUNNER_TEMP}/easm"; OUT="${RUNNER_TEMP}/easm-out"
          args=(--scope easm/scope.json --out-dir "${OUT}" --dnsx "${W}/dnsx.jsonl" --httpx "${W}/httpx.jsonl" \
                --naabu "${W}/naabu.jsonl" --nuclei "${W}/nuclei.jsonl" --dnstwist "${W}/dnstwist.json")
          [ -n "${REGISTER}" ] && args+=(--register "${REGISTER}")
          python3 -I .github/actions/easm/reconcile.py reconcile "${args[@]}"
          echo "out=${OUT}" >> "${GITHUB_OUTPUT}"

      - name: Open or update finding issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT: ${{ steps.reconcile.outputs.out }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for l in 'validation:high|D4C5F9|High-tier validation trigger: validate within 72 h' \
                   'security-finding|D93F0B|Security finding from a CI scan gate; pair with one sla:* label' \
                   'sla:critical|B60205|Critical: 48 h production, 7 d non-production' \
                   'sla:high|E99695|High: 7 d production, 30 d non-production' \
                   'sla:medium|FBCA04|Medium: 30 d production, 90 d non-production' \
                   'sla:low|C2E0C6|Low: 90 d or next maintenance; tracked only in non-production'; do
            IFS='|' read -r n c d <<< "${l}"
            gh label create "${n}" -R "${REPO}" --color "${c}" --description "${d}" --force > /dev/null
          done
          open_issue() {  # <title> <labels> <body>
            local existing
            existing="$(gh issue list -R "${REPO}" --state open --search "\"${1}\" in:title" --json number --jq '.[0].number // empty')"
            if [ -n "${existing}" ]; then
              gh issue comment "${existing}" -R "${REPO}" --body "Seen again: ${RUN_URL}" > /dev/null
            else
              gh issue create -R "${REPO}" --title "${1}" --label "${2}" --body "${3}" > /dev/null
            fi
          }
          n="$(jq '.findings | length' "${OUT}/findings.json")"
          for i in $(seq 0 $((n - 1))); do
            f="$(jq -c ".findings[${i}]" "${OUT}/findings.json")"
            kind="$(jq -r .kind <<< "${f}")"; host="$(jq -r .host <<< "${f}")"; sev="$(jq -r .severity <<< "${f}")"
            case "${kind}" in
              unknown-asset)
                open_issue "[easm] Unknown internet-facing asset: ${host}" "security-finding,sla:high,validation:high" \
                  "$(jq -r --arg run "${RUN_URL}" '"**Signal source**: external attack-surface scan\n**Tier**: High (validate within 72 hours; claim the asset in `easm/scope.json` known_hosts or the register, or remove it)\n\n- Host: `" + .host + "`\n- Open ports: " + ((.ports // []) | map(tostring) | join(", ") | if . == "" then "none seen" else . end) + "\n- Addresses: " + ((.addresses // []) | join(", ")) + "\n- " + .detail + "\n\nRun: " + $run' <<< "${f}")" ;;
              takeover-candidate)
                open_issue "[easm] Dangling DNS (takeover candidate): ${host}" "security-finding,sla:high" \
                  "$(jq -r --arg run "${RUN_URL}" '"- Host: `" + .host + "`\n- " + .detail + "\n\nRemove the record or re-create the target. Run: " + $run' <<< "${f}")" ;;
              nuclei)
                case "${sev}" in critical) sla=critical ;; high) sla=high ;; medium) sla=medium ;; *) sla=low ;; esac
                open_issue "[easm] ${host}: $(jq -r .template <<< "${f}")" "security-finding,sla:${sla}" \
                  "$(jq -r --arg run "${RUN_URL}" '"- Host: `" + .host + "`\n- Template: `" + .template + "` (" + .name + ", " + .severity + ")\n- Matched at: " + (.matched_at // "") + "\n\nRun: " + $run' <<< "${f}")" ;;
              lookalike-domain)
                open_issue "[easm] Registered lookalike domain: ${host}" "security-finding,sla:medium" \
                  "$(jq -r --arg run "${RUN_URL}" '"- Domain: `" + .host + "`\n- " + .detail + "\n\nWatch for a login page; a takedown request goes through the registrar (plan Step 29). Run: " + $run' <<< "${f}")" ;;
            esac
          done
          if [ "$(jq -r .inventory_review "${OUT}/findings.json")" = "true" ]; then
            open_issue "[easm] Inventory review: unknown internet-facing assets above threshold" "security" \
              "$(jq -r --arg run "${RUN_URL}" '(.counts["unknown-asset"] | tostring) + " unknown assets in one run (threshold 3). Onboarding skipped the inventory somewhere: review `easm/scope.json` and the repositories that deploy public endpoints.\n\nRun: " + $run' "${OUT}/findings.json")"
          fi

      - name: Publish dated and latest releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          OUT: ${{ steps.reconcile.outputs.out }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%F)"
          cd "${OUT}"
          sha256sum ./*.json ./*.md | sed "s#\./##" > SHA256SUMS
          {
            echo "External attack-surface scan ${DATE} (UTC). Reconciled by \`.github/actions/easm/reconcile.py\` at ${TARGET}."
            echo
            cat summary.md
            echo
            echo "Results are Confidential: they map what the controls miss. Verify with \`sha256sum -c SHA256SUMS\`."
          } > "${RUNNER_TEMP}/release-notes.md"
          publish() {
            gh release delete "${1}" -R "${REPO}" --cleanup-tag --yes 2>/dev/null || true
            gh release create "${1}" -R "${REPO}" --target "${TARGET}" --title "${2}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" --latest=false ./*
          }
          publish "easm-${DATE}" "EASM scan ${DATE}"
          publish "easm-latest" "EASM scan (latest: ${DATE})"
          gh release list -R "${REPO}" --limit 500 --json tagName \
            --jq '.[].tagName | select(test("^easm-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' \
            | sort -r | tail -n +27 | while IFS= read -r tag; do gh release delete "${tag}" -R "${REPO}" --cleanup-tag --yes; done

      - name: Quarterly attestation issue (first run of each quarter)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUT: ${{ steps.reconcile.outputs.out }}
        run: |
          set -euo pipefail
          month="$(date -u +%-m)"; day="$(date -u +%-d)"
          case "${month}" in 1|4|7|10) ;; *) exit 0 ;; esac
          [ "${day}" -le 7 ] || exit 0
          q="$(date -u +%Y)-Q$(( (month - 1) / 3 + 1 ))"
          title="Public asset attestation ${q}"
          if [ -z "$(gh issue list -R "${REPO}" --state all --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')" ]; then
            gh issue create -R "${REPO}" --title "${title}" --label security --body-file "${OUT}/public-assets.md"
          fi
