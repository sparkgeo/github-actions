name: CI
# Dogfoods this repo's own composite actions on every push and PR.
# Serves as a live reference implementation for consuming repos.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC — for scorecard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint workflow and action YAML files with actionlint.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Harden the runner (block all egress except the allowlist)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/github-actionlint

  # Lint Terraform/OpenTofu with tflint. This repo has no .tf files, so this is
  # a smoke test that the composite installs and runs (exits 0 on no findings).
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block all egress except the allowlist)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tflint

  # Scan dependency lockfiles with osv-scanner. This repo has no lockfiles, so
  # this is a smoke test that the composite installs and runs (exits 0).
  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload to the Security tab
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/osv-scanner

  # Unit-test the shared severity gate against fixture findings files.
  severity-gate:
    name: Severity Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run gate fixtures
        shell: bash
        run: bash tests/severity-gate/run.sh

      - name: osv-scanner fixtures (recorded osv-scanner 2.4.0 output)
        run: tests/osv-scanner/run.sh

  # Validate Helm/Kustomize with kubeconform. This repo has no charts/, so this
  # is a smoke test that the composite installs and runs (exits 0, nothing to
  # validate).
  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block all egress except the allowlist)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/kubeconform

  # Dogfood the threat-feeds composite against the mirror's latest snapshot
  # (threat-feeds-mirror.yml). Until the first mirror run after merge there is
  # no release, so the composite step is skipped with a warning rather than
  # failing. The normaliser is checked against recorded feed samples first.
  threat-feeds:
    name: Threat Feeds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Normaliser fixtures
        run: tests/threat-feeds/run.sh

      - name: Check for a published snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view threat-feeds-latest --json id >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=threat-feeds::no threat-feeds-latest release yet; composite not exercised"
          fi

      - id: feeds
        if: steps.snapshot.outputs.exists == 'true'
        uses: ./.github/actions/threat-feeds
        with:
          feeds: kev,threatfox

      - name: Inspect snapshot
        if: steps.snapshot.outputs.exists == 'true'
        env:
          DIR: ${{ steps.feeds.outputs.feeds-dir }}
          TAG: ${{ steps.feeds.outputs.tag }}
        run: |
          set -euo pipefail
          echo "snapshot ${TAG}"
          for f in kev threatfox; do
            jq -r '"\(.feed): \(.count) entries fetched \(.fetched_at)"' "${DIR}/${f}.json"
          done

  # DefectDojo hand-off (#185): the unconfigured path skips; then a real
  # DefectDojo 3.3.300 started from tests/defectdojo/docker-compose.yml takes
  # SARIF and Trivy imports, deduplicates a re-import, closes a fixed finding
  # and gets the SLA configuration. Audit egress: images from Docker Hub.
  defectdojo:
    name: DefectDojo Import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Skip path
        run: tests/defectdojo/run.sh skip

      - id: unconfigured
        uses: ./.github/actions/defectdojo-import
        with:
          file: tests/defectdojo/fixtures/findings.sarif
          scan-type: SARIF

      - name: Start DefectDojo
        env:
          UNCONFIGURED_IMPORTED: ${{ steps.unconfigured.outputs.imported }}
        run: |
          set -euo pipefail
          [ "${UNCONFIGURED_IMPORTED}" = "false" ]
          docker compose -f tests/defectdojo/docker-compose.yml up -d --quiet-pull
          for _ in $(seq 120); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v2/ || true)"
            if [ "${code}" = "401" ] || [ "${code}" = "200" ]; then echo "DefectDojo up"; exit 0; fi
            sleep 5
          done
          docker compose -f tests/defectdojo/docker-compose.yml logs --tail 50
          exit 1

      - name: Import, deduplicate, close, SLA
        run: tests/defectdojo/run.sh integration

      - name: Token for the composite check
        id: token
        run: |
          set -euo pipefail
          token="$(curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-only-admin-password"}' http://localhost:8080/api/v2/api-token-auth/ | jq -r .token)"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - id: composite
        uses: ./.github/actions/defectdojo-import
        with:
          file: tests/defectdojo/fixtures/trivy.json
          scan-type: Trivy Scan
          product: ci-fixture
          environment: staging
          url: http://localhost:8080
          token: ${{ steps.token.outputs.token }}

      - name: Composite re-import is a no-op
        env:
          IMPORTED: ${{ steps.composite.outputs.imported }}
          CREATED: ${{ steps.composite.outputs.created }}
          UNTOUCHED: ${{ steps.composite.outputs.untouched }}
        run: |
          echo "imported=${IMPORTED} created=${CREATED} untouched=${UNTOUCHED}"
          [ "${IMPORTED}" = "true" ] && [ "${CREATED}" = "0" ] && [ "${UNTOUCHED}" = "1" ]

      - name: DefectDojo logs on failure
        if: failure()
        run: docker compose -f tests/defectdojo/docker-compose.yml logs --tail 80 uwsgi initializer

  # Dogfood the app lint gate by calling the reusable workflow directly.
  # (MegaLinter has no composite under .github/actions — its only reliable gate
  # is its exit code, which needs continue-on-error + if:always; those are
  # job-step features composite-internal steps don't support. See lint-app.yml.)
  # EPSS/KEV/LEV override (#80): script fixtures, then the composite itself on
  # recorded osv-scanner output with fixture feeds, gated by severity-gate.
  epss-kev-override:
    name: EPSS/KEV Override
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block egress)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Override fixtures
        run: tests/epss-kev-override/run.sh

      - name: Build fixture feeds
        id: fixture
        run: |
          set -euo pipefail
          N=.github/actions/threat-feeds/normalize.py
          F=tests/epss-kev-override/fixtures
          D="${RUNNER_TEMP}/feeds"
          mkdir -p "${D}"
          python3 -I "${N}" --feed kev --input "${F}/kev.json" --output "${D}/kev.json"
          python3 -I "${N}" --feed epss --input "${F}/epss-2026-10-07.csv" --output "${D}/epss.json"
          for d in 2026-08-08 2026-09-07; do
            python3 -I "${N}" --feed epss --input "${F}/epss-${d}.csv" --output "${RUNNER_TEMP}/epss-${d}.json"
          done
          {
            echo "dir=${D}"
            echo "history<<EOF"
            echo "${RUNNER_TEMP}/epss-2026-08-08.json"
            echo "${RUNNER_TEMP}/epss-2026-09-07.json"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - id: override
        uses: ./.github/actions/epss-kev-override
        with:
          findings-file: tests/severity-gate/fixtures/osv-node-cvss-8.1.json
          feeds-dir: ${{ steps.fixture.outputs.dir }}
          snapshot-tag: fixture
          epss-history: ${{ steps.fixture.outputs.history }}
          downgrade: "true"

      - id: gate
        uses: ./.github/actions/severity-gate
        with:
          findings-file: ${{ steps.override.outputs.findings-file }}
          fail-on-severity: none

      - name: Check composite outputs
        env:
          UP: ${{ steps.override.outputs.uplifted }}
          DOWN: ${{ steps.override.outputs.downgraded }}
          MAX: ${{ steps.gate.outputs.max-severity }}
        run: |
          set -euo pipefail
          echo "uplifted=${UP} downgraded=${DOWN} gate max-severity=${MAX}"
          [ "${UP}" = "3" ] && [ "${DOWN}" = "1" ] && [ "${MAX}" = "critical" ]

  lint-app:
    name: Lint App
    permissions:
      contents: read
      security-events: write  # SARIF upload to the Security tab
    uses: ./.github/workflows/lint-app.yml
    with:
      default-branch: main
      flavor: documentation  # covers ACTION, BASH, JSON, MARKDOWN, YAML; ~1/3 of the full image

  # Run this repo's own .pre-commit-config.yaml hooks via the composite.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block all egress except the allowlist)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the PR diff range can be resolved

      - uses: ./.github/actions/pre-commit

  # Pattern-based secret detection with Gitleaks.
  # Hard-fails the build on any match. On PRs scans only the PR commit range.
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block all egress except the allowlist)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the PR commit range can be scanned

      - uses: ./.github/actions/gitleaks

  # Verified active-secret detection with TruffleHog.
  # Hard-fails on any verified secret; unverified matches are warnings in the
  # Security tab. On PRs scans only the PR commit range.
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload to the Security tab
    steps:
      - name: Harden the runner (block all egress except the allowlist)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the PR commit range can be scanned

      - uses: ./.github/actions/trufflehog

  # Security-scan workflow and action YAML files with zizmor.
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (block all egress except the allowlist)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/zizmor

  # Run OpenSSF Scorecard on push to main and schedule only.
  # Scorecard hard-requires the default branch; skipped on PRs and feature branches.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (block all egress except the allowlist)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            api.deps.dev:443
            api.osv.dev:443
            www.bestpractices.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/scorecard

  # Review dependency changes for vulnerabilities and license issues.
  # On pull_request: compares PR base/head via built-in event context.
  # On push to main: compares the pushed range (event.before → sha) so maintainers
  # can see the action work end-to-end without opening a PR.
  # Skipped on first push to a branch (event.before = zero SHA) — no base to compare.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (block all egress except the allowlist)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/dependency-review
        with:
          base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
          head-ref: ${{ github.event_name == 'push' && github.sha || '' }}

  # Verify Terramate and OpenTofu are installed correctly.
  # Terramate stack steps are no-ops in this repo (no stacks defined).
  terramate-opentofu-setup:
    name: Terramate + OpenTofu Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block all egress except the allowlist)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443
            get.opentofu.org:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # terramate --changed requires full git history

      - uses: ./.github/actions/terramate-opentofu-setup
        env:
          # Telemetry hosts (analytics.terramate.io, checkpoint-api.mineiros.io)
          # are not on the allowlist; tell both CLIs not to call them.
          CHECKPOINT_DISABLE: "1"
          TM_DISABLE_CHECKPOINT: "1"
          TM_DISABLE_TELEMETRY: "1"

  # Verify the storage optimizer composite action runs without error.
  # Runs on push to main (demonstration) and workflow_dispatch (on-demand).
  storage-optimizer:
    name: Storage Optimizer
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - name: Harden the runner (block all egress except the allowlist)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: block
          # docs/egress-allowlist.md — update there and here in the same PR.
          allowed-endpoints: >
            github.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/storage-optimizer
