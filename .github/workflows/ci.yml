name: CI
# Dogfoods this repo's own composite actions on every push and PR.
# Serves as a live reference implementation for consuming repos.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC — for scorecard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint workflow and action YAML files with actionlint.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/github-actionlint

  # Lint Terraform/OpenTofu with tflint. This repo has no .tf files, so this is
  # a smoke test that the composite installs and runs (exits 0 on no findings).
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tflint

  # Scan IaC with checkov against the committed fixtures: the clean fixture
  # must pass at the default gate, and the gate script is unit-tested.
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload to the Security tab
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Gate script fixtures
        shell: bash
        run: bash tests/iac-scan/run.sh

      - uses: ./.github/actions/checkov
        with:
          directory: tests/iac-scan/fixtures/clean

  # Validate Helm/Kustomize with kubeconform. This repo has no charts/, so this
  # is a smoke test that the composite installs and runs (exits 0, nothing to
  # validate).
  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/kubeconform

  # DR policy pack (#93): checkov over the pass and fail fixtures through the
  # test script, then the composite with the curated list on both fixtures.
  dr-check:
    name: DR Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install checkov through the composite (pass fixture, zero findings)
        id: pass
        uses: ./.github/actions/checkov
        with:
          directory: tests/dr-check/fixtures/pass
          frameworks: terraform
          checks: CKV_AWS_21,CKV_AWS_144,CKV_AWS_133,CKV_AWS_157,CKV_AWS_28,CKV_AWS_134,CKV_AWS_166,SPK_DR_1,SPK_DR_2,SPK_DR_3,SPK_DR_4
          external-checks-dir: policies/dr
          include-passed: "true"
          sarif-upload: "false"

      - name: Policy pack and report fixtures
        env:
          CHECKOV: ${{ runner.temp }}/checkov
        run: tests/dr-check/run.sh

      - name: Composite on the fail fixture (advisory)
        id: failing
        uses: ./.github/actions/checkov
        with:
          directory: tests/dr-check/fixtures/fail
          frameworks: terraform
          checks: CKV_AWS_21,CKV_AWS_144,CKV_AWS_133,CKV_AWS_157,CKV_AWS_28,CKV_AWS_134,CKV_AWS_166,SPK_DR_1,SPK_DR_2,SPK_DR_3,SPK_DR_4
          external-checks-dir: policies/dr
          include-passed: "true"
          fail-on-severity: none
          sarif-upload: "false"

      - name: Outcomes
        env:
          PASS_FAILED: ${{ steps.pass.outputs.failed-count }}
          FAIL_FAILED: ${{ steps.failing.outputs.failed-count }}
          RESULTS: ${{ steps.failing.outputs.results-json }}
        run: |
          [ "${PASS_FAILED}" = "0" ] || { echo "::error title=dr-check::pass fixture had ${PASS_FAILED} findings"; exit 1; }
          [ "${FAIL_FAILED}" = "11" ] || { echo "::error title=dr-check::expected 11 findings on the fail fixture, got ${FAIL_FAILED}"; exit 1; }
          python3 -I .github/actions/checkov/dr-report.py --json "${RESULTS}" --report "${RUNNER_TEMP}/dr-report.md" --directory tests/dr-check/fixtures/fail > /dev/null

  # Serverless policy pack (#183): checkov over the Terraform and CloudFormation
  # fixtures, the shared-role script and the trivy package scan through the
  # test script, then the composite on the Terraform fail fixture.
  serverless-scan:
    name: Serverless Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install checkov through the composite (Terraform pass fixture, zero findings)
        id: pass
        uses: ./.github/actions/checkov
        with:
          directory: tests/serverless-scan/fixtures/terraform/pass
          frameworks: terraform
          checks: CKV_AWS_116,CKV_AWS_115,CKV_AWS_45,CKV_AWS_173,CKV_AWS_66,CKV_AWS_287,CKV_AWS_288,CKV_AWS_289,CKV_AWS_290,CKV_AWS_355,CKV_AWS_356,SPK_SLS_1,SPK_SLS_3
          external-checks-dir: policies/serverless
          include-passed: "true"
          sarif-upload: "false"

      - name: Install trivy
        env:
          TRIVY_VERSION: "0.75.0"
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          BASE="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfL -o "${TMP}/trivy.tgz" "${BASE}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "${TMP}/checksums.txt" "${BASE}/trivy_${TRIVY_VERSION}_checksums.txt"
          ( cd "${TMP}" && mv trivy.tgz "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" && grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz\$" checksums.txt | sha256sum -c - )
          tar -xzf "${TMP}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -C "${TMP}" trivy
          install "${TMP}/trivy" "${RUNNER_TEMP}/trivy"

      - name: Policy pack, shared-role script and package scan fixtures
        env:
          CHECKOV: ${{ runner.temp }}/checkov
          TRIVY: ${{ runner.temp }}/trivy
        run: tests/serverless-scan/run.sh

      - name: Composite on the Terraform fail fixture (advisory)
        id: failing
        uses: ./.github/actions/checkov
        with:
          directory: tests/serverless-scan/fixtures/terraform/fail
          frameworks: terraform
          checks: CKV_AWS_116,CKV_AWS_115,CKV_AWS_45,CKV_AWS_173,CKV_AWS_66,CKV_AWS_287,CKV_AWS_288,CKV_AWS_289,CKV_AWS_290,CKV_AWS_355,CKV_AWS_356,SPK_SLS_1,SPK_SLS_3
          external-checks-dir: policies/serverless
          fail-on-severity: none
          sarif-upload: "false"

      - name: Outcomes
        env:
          PASS_FAILED: ${{ steps.pass.outputs.failed-count }}
          FAIL_FAILED: ${{ steps.failing.outputs.failed-count }}
        run: |
          [ "${PASS_FAILED}" = "0" ] || { echo "::error title=serverless-scan::pass fixture had ${PASS_FAILED} findings"; exit 1; }
          [ "${FAIL_FAILED}" = "11" ] || { echo "::error title=serverless-scan::expected 11 findings on the fail fixture, got ${FAIL_FAILED}"; exit 1; }

  # Dogfood the app lint gate by calling the reusable workflow directly.
  # (MegaLinter has no composite under .github/actions — its only reliable gate
  # is its exit code, which needs continue-on-error + if:always; those are
  # job-step features composite-internal steps don't support. See lint-app.yml.)
  lint-app:
    name: Lint App
    permissions:
      contents: read
      security-events: write  # SARIF upload to the Security tab
    uses: ./.github/workflows/lint-app.yml
    with:
      default-branch: main
      flavor: documentation  # covers ACTION, BASH, JSON, MARKDOWN, YAML; ~1/3 of the full image

  # Run this repo's own .pre-commit-config.yaml hooks via the composite.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the PR diff range can be resolved

      - uses: ./.github/actions/pre-commit

  # Pattern-based secret detection with Gitleaks.
  # Hard-fails the build on any match. On PRs scans only the PR commit range.
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the PR commit range can be scanned

      - uses: ./.github/actions/gitleaks

  # Verified active-secret detection with TruffleHog.
  # Hard-fails on any verified secret; unverified matches are warnings in the
  # Security tab. On PRs scans only the PR commit range.
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload to the Security tab
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the PR commit range can be scanned

      - uses: ./.github/actions/trufflehog

  # Security-scan workflow and action YAML files with zizmor.
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/zizmor

  # Run OpenSSF Scorecard on push to main and schedule only.
  # Scorecard hard-requires the default branch; skipped on PRs and feature branches.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/scorecard

  # Review dependency changes for vulnerabilities and license issues.
  # On pull_request: compares PR base/head via built-in event context.
  # On push to main: compares the pushed range (event.before → sha) so maintainers
  # can see the action work end-to-end without opening a PR.
  # Skipped on first push to a branch (event.before = zero SHA) — no base to compare.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/dependency-review
        with:
          base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
          head-ref: ${{ github.event_name == 'push' && github.sha || '' }}
          # tests/serverless-scan/fixtures/package/requirements.txt pins
          # requests 2.19.1 on purpose so the package scan has a finding
          # (GHSA-x84v-xcm2-53pg). Nothing in this repo installs it.
          allow-ghsas: GHSA-x84v-xcm2-53pg

  # Verify Terramate and OpenTofu are installed correctly.
  # Terramate stack steps are no-ops in this repo (no stacks defined).
  terramate-opentofu-setup:
    name: Terramate + OpenTofu Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # terramate --changed requires full git history

      - uses: ./.github/actions/terramate-opentofu-setup

  # Verify the storage optimizer composite action runs without error.
  # Runs on push to main (demonstration) and workflow_dispatch (on-demand).
  storage-optimizer:
    name: Storage Optimizer
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/storage-optimizer
