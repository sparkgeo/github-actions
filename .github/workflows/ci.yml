name: CI
# Dogfoods this repo's own composite actions on every push and PR.
# Serves as a live reference implementation for consuming repos.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC — for scorecard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint workflow and action YAML files with actionlint.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/github-actionlint

  # Lint Terraform/OpenTofu with tflint. This repo has no .tf files, so this is
  # a smoke test that the composite installs and runs (exits 0 on no findings).
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tflint

  # Validate Helm/Kustomize with kubeconform. This repo has no charts/, so this
  # is a smoke test that the composite installs and runs (exits 0, nothing to
  # validate).
  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/kubeconform

  # Dogfood the app lint gate by calling the reusable workflow directly.
  # (MegaLinter has no composite under .github/actions — its only reliable gate
  # is its exit code, which needs continue-on-error + if:always; those are
  # job-step features composite-internal steps don't support. See lint-app.yml.)
  lint-app:
    name: Lint App
    permissions:
      contents: read
      security-events: write  # SARIF upload to the Security tab
    uses: ./.github/workflows/lint-app.yml
    with:
      default-branch: main
      flavor: documentation  # covers ACTION, BASH, JSON, MARKDOWN, YAML; ~1/3 of the full image

  # Run this repo's own .pre-commit-config.yaml hooks via the composite.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the PR diff range can be resolved

      - uses: ./.github/actions/pre-commit

  # Pattern-based secret detection with Gitleaks.
  # Hard-fails the build on any match. On PRs scans only the PR commit range.
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the PR commit range can be scanned

      - uses: ./.github/actions/gitleaks

  # Verified active-secret detection with TruffleHog.
  # Hard-fails on any verified secret; unverified matches are warnings in the
  # Security tab. On PRs scans only the PR commit range.
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload to the Security tab
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the PR commit range can be scanned

      - uses: ./.github/actions/trufflehog

  # Security-scan workflow and action YAML files with zizmor.
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/zizmor

  # Run OpenSSF Scorecard on push to main and schedule only.
  # Scorecard hard-requires the default branch; skipped on PRs and feature branches.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/scorecard

  # Review dependency changes for vulnerabilities and license issues.
  # On pull_request: compares PR base/head via built-in event context.
  # On push to main: compares the pushed range (event.before → sha) so maintainers
  # can see the action work end-to-end without opening a PR.
  # Skipped on first push to a branch (event.before = zero SHA) — no base to compare.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/dependency-review
        with:
          base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
          head-ref: ${{ github.event_name == 'push' && github.sha || '' }}

  # Verify Terramate and OpenTofu are installed correctly.
  # Terramate stack steps are no-ops in this repo (no stacks defined).
  terramate-opentofu-setup:
    name: Terramate + OpenTofu Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # terramate --changed requires full git history

      - uses: ./.github/actions/terramate-opentofu-setup

  # Verify the storage optimizer composite action runs without error.
  # Runs on push to main (demonstration) and workflow_dispatch (on-demand).
  storage-optimizer:
    name: Storage Optimizer
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/storage-optimizer

  # ZAP baseline (issue #65): gate.py against a recorded ZAP 2.17.0 report,
  # then a live scan of tests/dast-baseline/fixtures/site served on the
  # runner. The fixture rules file ignores 10036 and forces 10021 to FAIL, so
  # the live run must fail on exactly that rule and ZAP must report the
  # IGNORE. Audit egress: ghcr.io (ZAP image).
  dast-baseline:
    name: DAST baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Gate fixtures
        run: tests/dast-baseline/run.sh

      - name: Serve the fixture site
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory tests/dast-baseline/fixtures/site > /dev/null 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8080/ > /dev/null && exit 0; sleep 1; done
          echo "::error title=dast-baseline::fixture site did not start"; exit 1

      - id: live
        uses: ./.github/actions/zap-baseline
        continue-on-error: true
        with:
          target-url: http://127.0.0.1:8080/
          rules-file: tests/dast-baseline/fixtures/rules.tsv
          report-dir: ${{ runner.temp }}/zap-report

      - name: Assert the live scan
        env:
          OUTCOME: ${{ steps.live.outcome }}
          BLOCKING: ${{ steps.live.outputs.blocking-count }}
          MEDIUM: ${{ steps.live.outputs.medium-count }}
          OUT: ${{ runner.temp }}/zap-report
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error title=dast-baseline::the FAIL rule did not fail the scan (${OUTCOME})"; exit 1; }
          [ "${BLOCKING}" = "1" ] || { echo "::error title=dast-baseline::expected 1 blocking alert (10021), got ${BLOCKING}"; exit 1; }
          [ "${MEDIUM}" -ge 2 ] || { echo "::error title=dast-baseline::expected the fixture's missing CSP and anti-clickjacking alerts, got ${MEDIUM} Medium"; exit 1; }
          grep -q 'IGNORE: 1' "${OUT}/zap-output.txt" || { echo "::error title=dast-baseline::ZAP did not apply the rules file"; exit 1; }

  # ZAP API scan (issue #67): tests/dast-api/fixtures/app.py serves an
  # OpenAPI definition and one operation that answers a quote with a MySQL
  # syntax error, but only when X-Fixture-Token is sent. The live scan sends
  # the header through auth-header and must report SQL Injection (High) and
  # fail the gate. Audit egress: ghcr.io (ZAP image).
  dast-api:
    name: DAST API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Start the fixture API
        env:
          FIXTURE_TOKEN: ci-fixture-token
        run: |
          python3 tests/dast-api/fixtures/app.py 8082 > /dev/null 2>&1 &
          for _ in $(seq 30); do curl -sf http://127.0.0.1:8082/openapi.json > /dev/null && exit 0; sleep 1; done
          echo "::error title=dast-api::fixture API did not start"; exit 1

      - id: live
        uses: ./.github/actions/zap-api
        continue-on-error: true
        with:
          target-url: http://127.0.0.1:8082
          spec-url: tests/dast-api/fixtures/openapi.json
          auth-header: "X-Fixture-Token: ci-fixture-token"
          report-dir: ${{ runner.temp }}/zap-api-report

      - name: Assert the live scan
        env:
          OUTCOME: ${{ steps.live.outcome }}
          OUT: ${{ runner.temp }}/zap-api-report
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error title=dast-api::the SQL injection did not fail the gate (${OUTCOME})"; exit 1; }
          jq -e '[.site[].alerts[] | select(.pluginid == "40018" and .riskcode == "3")] | length > 0' "${OUT}/zap.json" > /dev/null \
            || { echo "::error title=dast-api::SQL Injection not reported; was the auth header sent?"; exit 1; }
