name: CI
# Dogfoods this repo's own composite actions on every push and PR.
# Serves as a live reference implementation for consuming repos.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC — for scorecard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint workflow and action YAML files with actionlint.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/github-actionlint

  # Lint Terraform/OpenTofu with tflint. This repo has no .tf files, so this is
  # a smoke test that the composite installs and runs (exits 0 on no findings).
  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # tests/tagging/fixtures holds a deliberately untagged stack, so the
      # tagging pass is off here; the Tagging job dogfoods require-tags.
      - uses: ./.github/actions/tflint
        with:
          require-tags: "false"

  # Validate Helm/Kustomize with kubeconform. This repo has no charts/, so this
  # is a smoke test that the composite installs and runs (exits 0, nothing to
  # validate).
  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/kubeconform

  # Dogfood the conftest policy gate on the fixture chart/overlay (must pass the
  # bundled policies), then check the Rego bundle and gate.sh against recorded
  # fixtures with the conftest binary the composite installed.
  k8s-policy:
    name: K8s Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/k8s-policy
        with:
          charts-dir: tests/k8s-policy/fixtures/charts
          kustomize-dir: tests/k8s-policy/fixtures/kustomize/overlays

      - name: Policy bundle and gate script fixtures
        env:
          CONFTEST: ${{ runner.temp }}/conftest
        run: tests/k8s-policy/run.sh

  # Tagging standard (policies/tags): every enforcement point against pass and
  # fail fixtures, then the tflint and k8s-policy composites with require-tags
  # on the same fixtures. checkov is installed here because its composite (#6)
  # lives on another branch; the CDK aspect needs aws-cdk-lib from PyPI.
  tagging:
    name: Tagging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install tflint, conftest, checkov and aws-cdk-lib
        env:
          TFLINT_VERSION: "0.63.1"
          CONFTEST_VERSION: "0.71.1"
          CHECKOV_VERSION: "3.3.25"
          CHECKOV_SHA256: "d76cd26e0eb642be12f60751ee627be3bab6c81e7add30dee018a03c0c1941e2"
          CDK_VERSION: "2.273.0"
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          BASE="https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}"
          curl -sSfL -o "${TMP}/tflint_linux_amd64.zip" "${BASE}/tflint_linux_amd64.zip"
          curl -sSfL -o "${TMP}/checksums.txt" "${BASE}/checksums.txt"
          ( cd "${TMP}" && grep " tflint_linux_amd64.zip$" checksums.txt | sha256sum -c - )
          unzip -q "${TMP}/tflint_linux_amd64.zip" -d "${TMP}"
          install "${TMP}/tflint" "${RUNNER_TEMP}/tflint"
          BASE="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}"
          ASSET="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfL -o "${TMP}/${ASSET}" "${BASE}/${ASSET}"
          curl -sSfL -o "${TMP}/conftest-checksums.txt" "${BASE}/checksums.txt"
          ( cd "${TMP}" && grep " ${ASSET}$" conftest-checksums.txt | sha256sum -c - )
          tar -xzf "${TMP}/${ASSET}" -C "${TMP}" conftest
          install "${TMP}/conftest" "${RUNNER_TEMP}/conftest"
          curl -sSfL -o "${TMP}/checkov.zip" \
            "https://github.com/bridgecrewio/checkov/releases/download/${CHECKOV_VERSION}/checkov_linux_X86_64.zip"
          echo "${CHECKOV_SHA256}  ${TMP}/checkov.zip" | sha256sum -c -
          unzip -j -q "${TMP}/checkov.zip" -d "${TMP}/bin"
          install "${TMP}/bin/checkov" "${RUNNER_TEMP}/checkov"
          python3 -m pip install --quiet --user "aws-cdk-lib==${CDK_VERSION}"

      - name: Enforcement point fixtures
        env:
          TFLINT: ${{ runner.temp }}/tflint
          CONFTEST: ${{ runner.temp }}/conftest
          CHECKOV: ${{ runner.temp }}/checkov
          GITHUB_TOKEN: ${{ github.token }}
        run: tests/tagging/run.sh

      - name: tflint composite, tagged fixture passes
        uses: ./.github/actions/tflint
        with:
          directory: tests/tagging/fixtures/terraform/aws-pass

      - name: tflint composite, untagged fixture fails
        id: tflint-fail
        continue-on-error: true
        uses: ./.github/actions/tflint
        with:
          directory: tests/tagging/fixtures/terraform/aws-fail

      - name: k8s-policy composite, tagged fixture passes
        uses: ./.github/actions/k8s-policy
        with:
          charts-dir: ""
          kustomize-dir: tests/tagging/fixtures/manifests/tagged

      - name: k8s-policy composite, untagged fixture fails
        id: k8s-fail
        continue-on-error: true
        uses: ./.github/actions/k8s-policy
        with:
          charts-dir: ""
          kustomize-dir: tests/tagging/fixtures/manifests/untagged

      - name: Untagged fixtures must have failed
        env:
          TFLINT_OUTCOME: ${{ steps.tflint-fail.outcome }}
          K8S_OUTCOME: ${{ steps.k8s-fail.outcome }}
        run: |
          [ "${TFLINT_OUTCOME}" = "failure" ] || { echo "::error title=tagging::tflint composite passed the untagged fixture"; exit 1; }
          [ "${K8S_OUTCOME}" = "failure" ] || { echo "::error title=tagging::k8s-policy composite passed the untagged fixture"; exit 1; }

  # Asset inventory (#115): parser, renderer and diff fixtures, then the
  # composite on the recorded plan and template fixtures. Real plan artefacts
  # come from consuming repos; asset-inventory.yml is exercised there.
  asset-inventory:
    name: Asset Inventory
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install check-jsonschema
        run: python3 -m pip install --quiet --user check-jsonschema

      - name: Parser, renderer and diff fixtures
        run: tests/asset-inventory/run.sh

      - name: Composite on the OpenTofu fixture
        id: tofu
        uses: ./.github/actions/asset-inventory
        with:
          stack: tofu
          input-dir: tests/asset-inventory/fixtures/tofu
          base-inventory: tests/asset-inventory/fixtures/base-inventory.json
          output-dir: ${{ runner.temp }}/asset-inventory-tofu

      - name: Composite on the CDK fixture
        id: cdk
        uses: ./.github/actions/asset-inventory
        with:
          stack: cdk
          input-dir: tests/asset-inventory/fixtures/cdk/cdk.out
          output-dir: ${{ runner.temp }}/asset-inventory-cdk

      - name: Outputs and SVG
        env:
          TOFU_COUNT: ${{ steps.tofu.outputs.resource-count }}
          TOFU_ADDED: ${{ steps.tofu.outputs.added-count }}
          CDK_VIOLATIONS: ${{ steps.cdk.outputs.violation-count }}
          DIR: ${{ runner.temp }}/asset-inventory-tofu
        run: |
          set -euo pipefail
          [ "${TOFU_COUNT}" = "8" ] || { echo "::error title=asset-inventory::expected 8 tofu resources, got ${TOFU_COUNT}"; exit 1; }
          [ "${TOFU_ADDED}" = "6" ] || { echo "::error title=asset-inventory::expected 6 added, got ${TOFU_ADDED}"; exit 1; }
          [ "${CDK_VIOLATIONS}" = "2" ] || { echo "::error title=asset-inventory::expected 2 cdk violations, got ${CDK_VIOLATIONS}"; exit 1; }
          grep -q '<svg' "${DIR}/inventory.svg"
          ( cd "${DIR}" && sha256sum -c SHA256SUMS )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: asset-inventory-fixtures
          path: ${{ runner.temp }}/asset-inventory-tofu/

  # Dogfood the app lint gate by calling the reusable workflow directly.
  # (MegaLinter has no composite under .github/actions — its only reliable gate
  # is its exit code, which needs continue-on-error + if:always; those are
  # job-step features composite-internal steps don't support. See lint-app.yml.)
  lint-app:
    name: Lint App
    permissions:
      contents: read
      security-events: write  # SARIF upload to the Security tab
    uses: ./.github/workflows/lint-app.yml
    with:
      default-branch: main
      flavor: documentation  # covers ACTION, BASH, JSON, MARKDOWN, YAML; ~1/3 of the full image

  # Run this repo's own .pre-commit-config.yaml hooks via the composite.
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the PR diff range can be resolved

      - uses: ./.github/actions/pre-commit

  # Pattern-based secret detection with Gitleaks.
  # Hard-fails the build on any match. On PRs scans only the PR commit range.
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the PR commit range can be scanned

      - uses: ./.github/actions/gitleaks

  # Verified active-secret detection with TruffleHog.
  # Hard-fails on any verified secret; unverified matches are warnings in the
  # Security tab. On PRs scans only the PR commit range.
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload to the Security tab
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # full history so the PR commit range can be scanned

      - uses: ./.github/actions/trufflehog

  # Security-scan workflow and action YAML files with zizmor.
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/zizmor

  # Run OpenSSF Scorecard on push to main and schedule only.
  # Scorecard hard-requires the default branch; skipped on PRs and feature branches.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/scorecard

  # Review dependency changes for vulnerabilities and license issues.
  # On pull_request: compares PR base/head via built-in event context.
  # On push to main: compares the pushed range (event.before → sha) so maintainers
  # can see the action work end-to-end without opening a PR.
  # Skipped on first push to a branch (event.before = zero SHA) — no base to compare.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/dependency-review
        with:
          base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
          head-ref: ${{ github.event_name == 'push' && github.sha || '' }}

  # Verify Terramate and OpenTofu are installed correctly.
  # Terramate stack steps are no-ops in this repo (no stacks defined).
  terramate-opentofu-setup:
    name: Terramate + OpenTofu Setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # terramate --changed requires full git history

      - uses: ./.github/actions/terramate-opentofu-setup

  # Verify the storage optimizer composite action runs without error.
  # Runs on push to main (demonstration) and workflow_dispatch (on-demand).
  storage-optimizer:
    name: Storage Optimizer
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/storage-optimizer
