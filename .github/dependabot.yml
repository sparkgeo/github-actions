# Dependabot owns version updates for the github-actions ecosystem org-wide: it
# keeps SHA-pinned action references current with zero infrastructure. Every
# other ecosystem (npm, pip, Go, Terraform, Helm, Docker base images) is handled
# by the central Renovate runner (#86), so no dependency gets version-update PRs
# from both. Reference config and rationale: docs/dependabot.md
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows only; composites need their own directories.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    # Let a new release settle before adopting it (supply-chain hygiene).
    cooldown:
      default-days: 7
    # One PR per action per week, covering every directory that pins it.
    # Without group-by, Dependabot opens a separate PR per directory.
    groups:
      actions:
        group-by: dependency-name
    commit-message:
      prefix: "ci"
