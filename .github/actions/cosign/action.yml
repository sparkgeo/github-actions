name: "Cosign Sign / Verify"
description: |
  Signs or verifies a container image with cosign using Sigstore keyless
  signing. The signing identity is the GitHub Actions OIDC token of the
  calling workflow, so there is no key to store or rotate; the signature is
  stored in the registry next to the image and recorded in the Rekor
  transparency log.

    mode: sign    -> cosign sign --yes <image>
    mode: verify  -> cosign verify --certificate-identity-regexp <regexp>
                                   --certificate-oidc-issuer <issuer> <image>

  The image must be a digest reference (registry/repo@sha256:...); tags are
  rejected because a tag can be re-pointed after signing. Registry
  credentials come from the calling job (docker login before this step).

  Installs a pinned, checksum-verified cosign binary.

  Required permissions on calling job: id-token: write (sign), plus
  packages: write (sign) or packages: read (verify) for GHCR images.
inputs:
  version:
    description: "cosign version to install (no leading 'v')."
    default: "3.1.3"
  mode:
    description: "sign or verify."
    required: true
  image:
    description: "Image digest reference, e.g. ghcr.io/org/image@sha256:..."
    required: true
  certificate-identity-regexp:
    description: "verify only: regexp the signer's certificate identity (the signing workflow URI) must match."
    default: ""
  certificate-oidc-issuer:
    description: "verify only: OIDC issuer that must have issued the signing certificate."
    default: "https://token.actions.githubusercontent.com"
outputs:
  identity:
    description: "verify only: the certificate identity that signed the image. Empty for Sigstore bundle-format signatures (the cosign v3 default), where cosign does not report the subject; the identity regexp is enforced either way."
    value: ${{ steps.run.outputs.identity }}
runs:
  using: "composite"
  steps:
    - name: Install cosign
      shell: bash
      env:
        COSIGN_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        TMP="$(mktemp -d)"
        BASE="https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}"
        curl -sSfL -o "${TMP}/cosign-linux-amd64" "${BASE}/cosign-linux-amd64"
        curl -sSfL -o "${TMP}/checksums.txt" "${BASE}/cosign_checksums.txt"
        # Verify the downloaded binary against the published checksum before use.
        ( cd "${TMP}" && grep " cosign-linux-amd64\$" checksums.txt | sha256sum -c - )
        # Install to RUNNER_TEMP and invoke by absolute path; avoids GITHUB_PATH.
        install "${TMP}/cosign-linux-amd64" "${RUNNER_TEMP}/cosign"

    - name: Run cosign
      id: run
      shell: bash
      env:
        COSIGN: ${{ runner.temp }}/cosign
        MODE: ${{ inputs.mode }}
        IMAGE: ${{ inputs.image }}
        IDENTITY_REGEXP: ${{ inputs.certificate-identity-regexp }}
        OIDC_ISSUER: ${{ inputs.certificate-oidc-issuer }}
      run: bash "${GITHUB_ACTION_PATH}/cosign.sh"
