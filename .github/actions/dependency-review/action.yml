name: "Dependency Review"
description: "Blocks PRs that introduce dependencies with known vulnerabilities or non-permitted licenses; posts a summary comment on the PR."
inputs:
  fail-on-severity:
    description: "Lowest vulnerability severity that fails the build: critical, high, medium, low, or none (docs/gate-policy.md). `moderate` accepted as an alias for medium."
    default: "high"
  allow-licenses:
    description: "Comma-separated list of SPDX license identifiers that are permitted. Dependencies using any other license will fail the check."
    default: "MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Unlicense, CC0-1.0"
  allow-dependencies-licenses:
    description: "Comma-separated purls exempt from the license check (e.g. pkg:githubactions/owner/repo). Use for tools run in CI but not redistributed, where a copyleft licence does not apply."
    default: ""
  comment-summary-in-pr:
    description: "Post a summary comment on the PR: always|on-failure|never"
    default: "on-failure"
  base-ref:
    description: "Base commit SHA for non-PR events (e.g. github.event.before on push). Leave empty on pull_request — the action reads PR context automatically."
    default: ""
  head-ref:
    description: "Head commit SHA for non-PR events (e.g. github.sha on push). Leave empty on pull_request."
    default: ""
runs:
  using: "composite"
  steps:
    - name: Validate ref inputs
      if: ${{ (inputs.base-ref != '' && inputs.head-ref == '') || (inputs.base-ref == '' && inputs.head-ref != '') }}
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        HEAD_REF: ${{ inputs.head-ref }}
      run: |
        echo "::error::dependency-review: base-ref and head-ref must both be set or both be empty. Got base-ref='${BASE_REF}' head-ref='${HEAD_REF}'."
        exit 1
    - name: Map severity vocabulary
      id: sev
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on-severity }}
      run: |
        set -euo pipefail
        # Canonical vocabulary (docs/gate-policy.md) to upstream values.
        case "${FAIL_ON}" in
          critical|high|low) up="${FAIL_ON}"; check=true ;;
          medium|moderate)   up="moderate";   check=true ;;
          none)              up="low";        check=false ;;
          *) echo "::error title=dependency-review::invalid fail-on-severity '${FAIL_ON}'"; exit 1 ;;
        esac
        echo "upstream=${up}" >> "${GITHUB_OUTPUT}"
        echo "vulnerability-check=${check}" >> "${GITHUB_OUTPUT}"
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
      if: ${{ inputs.base-ref == '' }}
      with:
        fail-on-severity: ${{ steps.sev.outputs.upstream }}
        vulnerability-check: ${{ steps.sev.outputs.vulnerability-check }}
        allow-licenses: ${{ inputs.allow-licenses }}
        allow-dependencies-licenses: ${{ inputs.allow-dependencies-licenses }}
        comment-summary-in-pr: ${{ inputs.comment-summary-in-pr }}
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
      if: ${{ inputs.base-ref != '' }}
      with:
        base-ref: ${{ inputs.base-ref }}
        head-ref: ${{ inputs.head-ref }}
        fail-on-severity: ${{ steps.sev.outputs.upstream }}
        vulnerability-check: ${{ steps.sev.outputs.vulnerability-check }}
        allow-licenses: ${{ inputs.allow-licenses }}
        allow-dependencies-licenses: ${{ inputs.allow-dependencies-licenses }}
        comment-summary-in-pr: ${{ inputs.comment-summary-in-pr }}
