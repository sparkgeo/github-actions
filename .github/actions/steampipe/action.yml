name: "Steampipe"
description: |
  Installs a pinned, checksum-verified Steampipe binary and the requested
  plugins, then runs one SQL query against the live cloud account with the
  ambient credentials (pair with aws-oidc-auth) and writes the JSON result
  (issue #117). With an empty query it only installs, for smoke tests.

  Egress: github.com and release-assets.githubusercontent.com for the binary
  and the embedded Postgres, hub.steampipe.io, ghcr.io and
  pkg-containers.githubusercontent.com for plugins. Benchmarks from the
  Steampipe mods (steampipe-mod-aws-tags) need Powerpipe and are not run here.

  Required permissions on the calling job: contents: read.
inputs:
  version:
    description: "Steampipe release to install (no leading 'v'), verified against its checksums.txt."
    default: "2.4.7"
  plugins:
    description: "Comma-separated plugins with versions, e.g. aws@1.34.0,gcp@1.2.0."
    default: "aws@1.34.0"
  query:
    description: "SQL to run with `steampipe query --output json`. Empty installs only."
    default: ""
  output-file:
    description: "Where the query JSON ({columns, rows}) is written."
    default: ${{ runner.temp }}/steampipe-query.json
outputs:
  row-count:
    description: "Rows returned by the query (empty when no query ran)."
    value: ${{ steps.query.outputs.row-count }}
  output-file:
    description: "Path of the query JSON."
    value: ${{ steps.query.outputs.output-file }}
runs:
  using: "composite"
  steps:
    - name: Install steampipe
      shell: bash
      env:
        STEAMPIPE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        TMP="$(mktemp -d)"
        BASE="https://github.com/turbot/steampipe/releases/download/v${STEAMPIPE_VERSION}"
        curl -sSfL -o "${TMP}/steampipe_linux_amd64.tar.gz" "${BASE}/steampipe_linux_amd64.tar.gz"
        curl -sSfL -o "${TMP}/checksums.txt" "${BASE}/checksums.txt"
        # Verify the downloaded archive against the published checksum before use.
        ( cd "${TMP}" && grep " steampipe_linux_amd64.tar.gz$" checksums.txt | sha256sum -c - )
        tar -xzf "${TMP}/steampipe_linux_amd64.tar.gz" -C "${TMP}" steampipe
        # Installed to RUNNER_TEMP and invoked by absolute path; avoids GITHUB_PATH.
        install "${TMP}/steampipe" "${RUNNER_TEMP}/steampipe"
        "${RUNNER_TEMP}/steampipe" --version

    - name: Install plugins
      shell: bash
      env:
        PLUGINS: ${{ inputs.plugins }}
        STEAMPIPE_INSTALL_DIR: ${{ runner.temp }}/steampipe-home
        STEAMPIPE_UPDATE_CHECK: "false"
        STEAMPIPE_TELEMETRY: "none"
      run: |
        set -euo pipefail
        IFS=',' read -ra list <<< "${PLUGINS}"
        for p in "${list[@]}"; do
          p="$(echo "${p}" | tr -d ' ')"
          [ -n "${p}" ] && "${RUNNER_TEMP}/steampipe" plugin install "${p}"
        done
        "${RUNNER_TEMP}/steampipe" plugin list

    - name: Run query
      id: query
      if: inputs.query != ''
      shell: bash
      env:
        QUERY: ${{ inputs.query }}
        OUTPUT_FILE: ${{ inputs.output-file }}
        STEAMPIPE_INSTALL_DIR: ${{ runner.temp }}/steampipe-home
        STEAMPIPE_UPDATE_CHECK: "false"
        STEAMPIPE_TELEMETRY: "none"
      run: |
        set -euo pipefail
        "${RUNNER_TEMP}/steampipe" query "${QUERY}" --output json > "${OUTPUT_FILE}"
        rows="$(jq '.rows | length' "${OUTPUT_FILE}")"
        {
          echo "row-count=${rows}"
          echo "output-file=${OUTPUT_FILE}"
        } >> "${GITHUB_OUTPUT}"
        echo "${rows} rows"
