name: "OSV-Scanner Dependency Scan"
description: |
  Scans all lockfiles in the repo against the OSV vulnerability database
  (https://osv.dev). Language-agnostic — one invocation covers Python, JS/TS,
  Go, Ruby, Rust, Java, etc.

  Installs a pinned, checksum-verified osv-scanner binary directly. Produces
  SARIF (optionally uploaded to the Security tab) and emits each finding as a
  job-level annotation. The step fails when any vulnerability's CVSS score is at
  or above the fail-on-severity threshold.

  Required permissions on calling job: contents: read (plus security-events:
  write when sarif-upload is true).
inputs:
  version:
    description: "osv-scanner version to install (no leading 'v')."
    default: "2.4.0"
  directory:
    description: "Directory to scan (recursively)."
    default: "."
  fail-on-severity:
    description: "Lowest severity that fails the build: critical, high, medium, low, or none (docs/gate-policy.md)."
    default: "critical"
  sarif-upload:
    description: "Upload SARIF results to the GitHub Security tab (needs security-events: write)."
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Install osv-scanner
      shell: bash
      env:
        OSV_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        TMP="$(mktemp -d)"
        BASE="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}"
        curl -sSfL -o "${TMP}/osv-scanner_linux_amd64" "${BASE}/osv-scanner_linux_amd64"
        curl -sSfL -o "${TMP}/osv-scanner_SHA256SUMS" "${BASE}/osv-scanner_SHA256SUMS"
        # Verify the downloaded binary against the published checksum before use.
        ( cd "${TMP}" && grep " osv-scanner_linux_amd64\$" osv-scanner_SHA256SUMS | sha256sum -c - )
        install "${TMP}/osv-scanner_linux_amd64" "${RUNNER_TEMP}/osv-scanner"

    - name: Scan dependencies
      id: scan
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
      run: |
        set -euo pipefail
        OSV="${RUNNER_TEMP}/osv-scanner"
        SARIF="${RUNNER_TEMP}/osv.sarif"
        JSON="${RUNNER_TEMP}/osv.json"
        # osv-scanner exit codes (v2): 0 clean, 1 vulnerabilities found (output
        # still written), 128 no package sources found (nothing written). We
        # gate on severity ourselves below, so 0 and 1 both continue. 128 means
        # the repo has no lockfiles: emit an empty result so the gate passes
        # and skip the SARIF upload. Anything else is a real error.
        run_scan() {
          local fmt="$1" out="$2" rc=0
          "${OSV}" scan source -r --format "${fmt}" --output-file "${out}" "${DIRECTORY}" || rc=$?
          case "${rc}" in
            0|1) ;;
            128) echo "::notice title=osv-scanner::no package sources found under '${DIRECTORY}'; nothing to scan" ;;
            *) echo "::error title=osv-scanner::scan failed with exit code ${rc}"; return "${rc}" ;;
          esac
          return 0
        }
        run_scan sarif "${SARIF}"
        run_scan json "${JSON}"
        if [ ! -s "${JSON}" ]; then
          echo '{"results":[]}' > "${JSON}"
          SARIF=""
        fi
        echo "sarif=${SARIF}" >> "${GITHUB_OUTPUT}"
        echo "json=${JSON}" >> "${GITHUB_OUTPUT}"

    - name: Upload SARIF to GitHub Security tab
      # hashFiles() only resolves paths inside GITHUB_WORKSPACE; the SARIF lives
      # in RUNNER_TEMP, so gate on the step output (empty when nothing was scanned).
      if: ${{ inputs.sarif-upload != 'false' && steps.scan.outputs.sarif != '' }}
      uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: osv-scanner

    - name: Annotate and enforce gate
      shell: bash
      env:
        FINDINGS_FILE: ${{ steps.scan.outputs.json }}
        FORMAT: osv-json
        FAIL_ON: ${{ inputs.fail-on-severity }}
      # Shared gate (docs/gate-policy.md). Referenced by path rather than
      # `uses:` so it resolves wherever this repo is checked out.
      run: bash "${{ github.action_path }}/../severity-gate/gate.sh"
