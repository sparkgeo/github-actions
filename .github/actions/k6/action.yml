name: "k6 Load Test"
description: |
  Runs a k6 script from the consuming repo against target-url (exported as
  BASE_URL) with a pinned, checksum-verified k6 binary (issue #74). The
  script's thresholds are the gate: k6 exits 99 when one is crossed and the
  step fails. The --summary-export JSON is rendered into the job summary
  (requests, p95, error rate, checks, every threshold) and kept for the
  artefact; key numbers are outputs.

  Required permissions on the calling job: contents: read.
inputs:
  version:
    description: "k6 release to install (no leading 'v'), verified against its checksums file."
    default: "2.3.0"
  script:
    description: "Path to the k6 script in the consuming repo."
    default: "tests/load/script.js"
  target-url:
    description: "Base URL under test; exported to the script as BASE_URL."
    required: true
  vus:
    description: "Virtual users (k6 --vus). Ignored when the script defines scenarios."
    default: "10"
  duration:
    description: "Run duration (k6 --duration), e.g. 1m."
    default: "1m"
  extra-args:
    description: "Extra arguments passed to k6 run."
    default: ""
  summary-file:
    description: "Where the --summary-export JSON is written."
    default: ${{ runner.temp }}/k6-summary.json
outputs:
  thresholds-failed:
    description: "Thresholds crossed."
    value: ${{ steps.summary.outputs.thresholds-failed }}
  thresholds-total:
    description: "Thresholds declared."
    value: ${{ steps.summary.outputs.thresholds-total }}
  p95-ms:
    description: "http_req_duration p(95) in milliseconds."
    value: ${{ steps.summary.outputs.p95-ms }}
  error-rate:
    description: "http_req_failed rate in percent."
    value: ${{ steps.summary.outputs.error-rate }}
  requests:
    description: "HTTP requests made."
    value: ${{ steps.summary.outputs.requests }}
  summary-file:
    description: "Path of the summary JSON."
    value: ${{ inputs.summary-file }}
runs:
  using: "composite"
  steps:
    - name: Install k6
      shell: bash
      env:
        K6_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        TMP="$(mktemp -d)"
        BASE="https://github.com/grafana/k6/releases/download/v${K6_VERSION}"
        ASSET="k6-v${K6_VERSION}-linux-amd64.tar.gz"
        curl -sSfL -o "${TMP}/${ASSET}" "${BASE}/${ASSET}"
        curl -sSfL -o "${TMP}/checksums.txt" "${BASE}/k6-v${K6_VERSION}-checksums.txt"
        # Verify the downloaded archive against the published checksum before use.
        ( cd "${TMP}" && grep " ${ASSET}$" checksums.txt | sha256sum -c - )
        tar -xzf "${TMP}/${ASSET}" -C "${TMP}" --strip-components=1 "k6-v${K6_VERSION}-linux-amd64/k6"
        # Installed to RUNNER_TEMP and invoked by absolute path; avoids GITHUB_PATH.
        install "${TMP}/k6" "${RUNNER_TEMP}/k6"
        "${RUNNER_TEMP}/k6" version

    - name: Run k6
      id: run
      shell: bash
      env:
        SCRIPT: ${{ inputs.script }}
        BASE_URL: ${{ inputs.target-url }}
        VUS: ${{ inputs.vus }}
        DURATION: ${{ inputs.duration }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        SUMMARY: ${{ inputs.summary-file }}
        K6_NO_USAGE_REPORT: "true"
      run: |
        set -euo pipefail
        [ -f "${SCRIPT}" ] || { echo "::error title=k6::script ${SCRIPT} not found"; exit 2; }
        read -ra extra <<< "${EXTRA_ARGS}"
        # Threshold failures (exit 99) are reported by the summary step so the
        # job summary is always written; any other failure stops here.
        rc=0
        "${RUNNER_TEMP}/k6" run --vus "${VUS}" --duration "${DURATION}" --summary-export "${SUMMARY}" "${extra[@]}" "${SCRIPT}" || rc=$?
        echo "rc=${rc}" >> "${GITHUB_OUTPUT}"
        if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 99 ]; then
          echo "::error title=k6::k6 exited ${rc}"
          exit "${rc}"
        fi

    - name: Summarise
      id: summary
      shell: bash
      env:
        SUMMARY: ${{ inputs.summary-file }}
        SCRIPT: ${{ inputs.script }}
        K6_RC: ${{ steps.run.outputs.rc }}
      run: |
        set -euo pipefail
        python3 -I "${GITHUB_ACTION_PATH}/summary.py" --summary "${SUMMARY}" --title "${SCRIPT}" && rc=0 || rc=$?
        if [ "${K6_RC}" = "99" ] || [ "${rc}" -ne 0 ]; then
          echo "::error title=k6::thresholds crossed; see the job summary"
          exit 1
        fi
