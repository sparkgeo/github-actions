
name: "Terramate and OpenTofu Setup and Cache"
description: "Setup Terramate and OpenTofu"
inputs:
  opentofu_version:
    description: "OpenTofu version to install"
    required: false
    default: "1.10.0"
  terramate_version:
    description: "Terramate version to install"
    required: false
    default: "0.14.7"
runs:
  using: "composite"
  steps:
    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4  # v2.0.1
      with:
        tofu_version: ${{ inputs.opentofu_version }}
        tofu_wrapper: false

    # Installed here rather than with terramate-io/terramate-action, whose
    # install script downloads the x86_64 build on every runner.
    - name: Setup Terramate
      shell: bash
      env:
        TERRAMATE_VERSION: ${{ inputs.terramate_version }}
      run: |
        set -euo pipefail
        case "${RUNNER_ARCH}" in X64) ARCH=x86_64 ;; ARM64) ARCH=arm64 ;; *) echo "::error::unsupported runner architecture ${RUNNER_ARCH}"; exit 1 ;; esac
        # Accept "0.14.7", "v0.14.7" or "latest" (discouraged: unpinned), as the upstream action did.
        VERSION="${TERRAMATE_VERSION#v}"
        if [ "${VERSION}" = latest ]; then
          echo "::warning::terramate_version 'latest' is unpinned; pin a version"
          VERSION="$(curl -sSfL -o /dev/null -w '%{url_effective}' https://github.com/terramate-io/terramate/releases/latest)"
          VERSION="${VERSION##*/v}"
        fi
        TMP="$(mktemp -d)"
        BASE="https://github.com/terramate-io/terramate/releases/download/v${VERSION}"
        TARBALL="terramate_${VERSION}_linux_${ARCH}.tar.gz"
        curl -sSfL -o "${TMP}/${TARBALL}" "${BASE}/${TARBALL}"
        curl -sSfL -o "${TMP}/checksums.txt" "${BASE}/checksums.txt"
        # Verify the downloaded archive against the published checksum before use.
        ( cd "${TMP}" && grep " ${TARBALL}\$" checksums.txt | sha256sum -c - )
        tar -xzf "${TMP}/${TARBALL}" -C "${TMP}" terramate
        # On PATH for the steps below (and the caller's), as the upstream action
        # did; sudo only when needed, so container jobs running as root work too.
        if [ -w /usr/local/bin ]; then install "${TMP}/terramate" /usr/local/bin/terramate
        else sudo install "${TMP}/terramate" /usr/local/bin/terramate; fi
        terramate --version

    - name: Check Terramate configurations are up to date
      shell: bash
      run: |
        terramate generate
        if ! git diff --quiet; then
          echo "Error: Terramate generated files are not up to date!"
          echo "Please run 'terramate generate' locally and commit the changes."
          git diff
          exit 1
        fi
        echo "Terramate generated files are up to date."

    - name: Tofu init changed stacks
      shell: bash
      run: terramate run --changed tofu init

    - name: List changed stacks
      shell: bash
      run: terramate list --changed

