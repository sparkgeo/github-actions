name: "Actionlint"
description: "Lints GitHub Actions workflow and composite action YAML files using actionlint via reviewdog."
runs:
  using: "composite"
  steps:
    - uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4  # v1.84.1
      with:
        github_token: ${{ github.token }}
        # github-check creates a separate check run and then PATCHes it; the PATCH
        # intermittently 404s, failing the job and leaving that check run stuck
        # in_progress. Annotations are workflow commands: no Checks API writes.
        reporter: github-annotations
        fail_level: error
