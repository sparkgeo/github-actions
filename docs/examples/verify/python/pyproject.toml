[project]
name = "verify-example-tiles"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["icontract==2.7.3"]

[project.optional-dependencies]
dev = ["hypothesis==6.169.3", "pytest==9.1.1", "crosshair-tool==0.0.111", "mypy==2.4.0", "mutmut==3.8.0"]

[tool.pytest.ini_options]
markers = ["property: property-based test, one per acceptance criterion"]
pythonpath = ["."]

[tool.mypy]
strict = true

[tool.mutmut]
source_paths = ["tiles/"]
pytest_add_cli_args_test_selection = ["tests/"]
