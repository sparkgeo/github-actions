# poutine configuration for this repository (pipeline-posture, issue #234).
# Triage redone on 2026-10-27 against main after the Blacksmith migration
# (#256), with poutine v1.1.6. Each entry names the finding it accepts and why.

rulesConfig:
  # poutine counts any runner label it does not recognise as GitHub-hosted as
  # self-hosted. Blacksmith runners are ephemeral VMs, one job each, so a PR
  # job cannot persist on them the way it can on a reused self-hosted runner.
  # The shared state Blacksmith does keep (the useblacksmith/checkout git
  # mirror) is tracked separately: fork-PR approval policy, #256 review.
  pr_runs_on_self_hosted:
    allowed_runners:
      - blacksmith-2vcpu-ubuntu-2404
      - blacksmith-2vcpu-ubuntu-2404-arm

skip:
  # Third-party actions reviewed, on the repo's actions allowlist and listed
  # in docs/approved-actions.md. Each entry matches the reviewed SHA only, so
  # a version bump (Dependabot) brings the note back for review: update the
  # SHA here in a follow-up PR once the new version is reviewed (Dependabot
  # PRs carry only dependabot[bot] commits, docs/dependabot.md).
  - rule: github_action_from_unverified_creator_used
    purl:
      - pkg:githubactions/opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4
      - pkg:githubactions/reviewdog/action-actionlint@419a49378266e892f40c773b4f2fc6de9aa87499
      - pkg:githubactions/useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a
      - pkg:githubactions/zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e

# Not skipped:
# - unpinnable_action notes on .github/actions/scorecard and
#   .github/actions/github-actionlint: poutine's reputation data lists
#   ossf/scorecard-action and reviewdog/action-actionlint as unpinnable (they
#   run container images). Visible until those composites install pinned,
#   checksum-verified binaries instead.
# - untrusted_checkout_exec has nothing to skip, but note its blind spot:
#   poutine v1.1.6 only recognises actions/checkout, not the
#   useblacksmith/checkout every workflow here uses, so it cannot see a PR-head
#   checkout. Its precondition, a pull_request_target or workflow_run trigger,
#   is reported by zizmor (dangerous-triggers, error) in pre-commit and the
#   Security tab.
