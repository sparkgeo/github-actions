title: AWS IAM user created with AdministratorAccess
id: 2c9d3f2e-6f1a-4f0e-9a7c-1b2c3d4e5f60
status: test
description: Detects attachment of the AdministratorAccess policy to a new IAM user.
references:
  - https://stratus-red-team.cloud/attack-techniques/AWS/aws.persistence.iam-create-admin-user/
author: Sparkgeo
date: 2026-10-01
modified: 2026-10-01
tags:
  - attack.persistence
  - attack.t1098.003
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: AttachUserPolicy
    requestParameters.policyArn: 'arn:aws:iam::aws:policy/AdministratorAccess'
  condition: selection
falsepositives:
  - Break-glass account provisioning
level: high
