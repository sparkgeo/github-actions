apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    owner: team-platform
    project: fixture
    environment: dev
    data-class: internal
    exposure: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: api
          image: ghcr.io/sparkgeo/api:latest
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
