# Minimal DefectDojo 3.3.300 for the defectdojo-import integration test
# (issue #185): upstream's docker-compose.yml without the build sections and
# celerybeat, images from Docker Hub pinned by digest. Test-only credentials.
services:
  nginx:
    image: docker.io/defectdojo/defectdojo-nginx@sha256:2804d871ed730caae7c8c524dbb663eb4c500dec48ce92a2773cf880e3389e1d  # 3.3.300
    depends_on: [uwsgi]
    environment:
      DD_UWSGI_HOST: uwsgi
      DD_UWSGI_PORT: "3031"
    ports:
      - "127.0.0.1:8080:8080"
  uwsgi:
    image: &django docker.io/defectdojo/defectdojo-django@sha256:6516f0f620867b76df766c5adb94a7538ef7c37560102c7b4d7ce4844993261c  # 3.3.300
    depends_on:
      initializer:
        condition: service_completed_successfully
    entrypoint: ['/wait-for-it.sh', 'postgres:5432', '-t', '30', '--', '/entrypoint-uwsgi.sh']
    environment: &env
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: "*"
      DD_DATABASE_URL: postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://valkey:6379/0
      DD_CACHE_URL: redis://valkey:6379/1
      DD_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret
      DD_CREDENTIAL_AES_256_KEY: ci-only-not-a-key-ci-only-not-a-k
  celeryworker:
    image: *django
    depends_on:
      initializer:
        condition: service_completed_successfully
    entrypoint: ['/wait-for-it.sh', 'postgres:5432', '-t', '30', '--', '/entrypoint-celery-worker.sh']
    environment: *env
  initializer:
    image: *django
    depends_on: [postgres]
    entrypoint: ['/wait-for-it.sh', 'postgres:5432', '--', '/entrypoint-initializer.sh']
    environment:
      <<: *env
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@defectdojo.local
      DD_ADMIN_PASSWORD: ci-only-admin-password
      DD_INITIALIZE: "true"
  postgres:
    image: docker.io/library/postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: defectdojo
  valkey:
    image: docker.io/valkey/valkey:9.1.2-alpine@sha256:a174b894902bd3367e330d47cc2054367dc4917701776aaf336f41d83b65ec7a
