apiVersion: v1
kind: Namespace
metadata:
  name: fixture
  labels:
    owner: team-platform
    project: fixture
    environment: dev
    data-class: internal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    owner: bob_at_sparkgeo.com
    project: fixture
    environment: prod
    data-class: confidential
    cost-center: cc-100
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: ghcr.io/sparkgeo/web:1.0.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
