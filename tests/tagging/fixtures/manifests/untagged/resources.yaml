apiVersion: v1
kind: Namespace
metadata:
  name: fixture
  labels:
    owner: bob
    project: Fixture_App
    environment: production
    data-class: internal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: ghcr.io/sparkgeo/web:1.0.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: not-taggable
data:
  key: value
