# Custom rule for the kind test: any shell started in a container in the demo
# namespace. Uses macros and lists from Falco's default rules.
- rule: Shell spawned in demo namespace
  desc: A shell started inside a container in the demo namespace
  condition: spawned_process and container and proc.name in (shell_binaries) and k8s.ns.name = "demo"
  output: Shell in demo container (user=%user.name command=%proc.cmdline container=%container.name ns=%k8s.ns.name)
  priority: WARNING
  tags: [container, shell, mitre_execution, T1059]
