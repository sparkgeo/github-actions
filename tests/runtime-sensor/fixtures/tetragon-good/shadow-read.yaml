# Observe-only: report reads of /etc/shadow (credential access, T1003.008).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: shadow-read
spec:
  kprobes:
    - call: security_file_permission
      syscall: false
      return: true
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      returnArg:
        index: 0
        type: int
      returnArgAction: Post
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /etc/shadow
