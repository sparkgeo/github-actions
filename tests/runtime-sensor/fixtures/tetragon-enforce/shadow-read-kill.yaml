# Must fail at this tier: kills the reader of of /etc/shadow (credential access, T1003.008).
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: shadow-read-kill
spec:
  kprobes:
    - call: security_file_permission
      syscall: false
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      selectors:
        - matchArgs:
            - index: 0
              operator: Prefix
              values:
                - /etc/shadow
          matchActions:
            - action: Sigkill
