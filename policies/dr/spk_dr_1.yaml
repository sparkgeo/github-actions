# DR policy pack (issue #93): RDS is covered by an AWS Backup selection. The
# filter keeps the connection check from also reporting on the selection.
metadata:
  id: "SPK_DR_1"
  name: "RDS instances and clusters are referenced by an aws_backup_selection"
  category: "BACKUP_AND_RECOVERY"
  guideline: "https://github.com/sparkgeo/github-actions/blob/main/docs/dr-checklist.md"
definition:
  and:
    - cond_type: filter
      attribute: resource_type
      operator: within
      value:
        - aws_db_instance
        - aws_rds_cluster
    - cond_type: connection
      resource_types:
        - aws_db_instance
        - aws_rds_cluster
      connected_resource_types:
        - aws_backup_selection
      operator: exists
