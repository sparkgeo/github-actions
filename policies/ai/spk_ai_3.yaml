# AI-service policy pack (issue #189, plan Step 17 Standard): every Cognitive
# Services account (Azure OpenAI included) has a diagnostic setting, so
# request and audit logs reach the workspace of plan Step 9.
metadata:
  id: "SPK_AI_3"
  name: "Cognitive Services account has a diagnostic setting"
  category: "LOGGING"
  guideline: "https://github.com/sparkgeo/github-actions/blob/main/README.md#iac-scan-checkov"
definition:
  and:
    - cond_type: filter
      attribute: resource_type
      operator: within
      value:
        - azurerm_cognitive_account
    - cond_type: connection
      resource_types:
        - azurerm_cognitive_account
      connected_resource_types:
        - azurerm_monitor_diagnostic_setting
      operator: exists
